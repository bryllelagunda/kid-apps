  firstLivingInOrder() {
    for (let k = 0; k < this.order.length; k++) {
      const p = players.byId(this.order[k]);
      if (p && p.alive) return { player: p, idx: players.list.indexOf(p), orderIdx: k };
    }
    return null;
  },

  /* The next living player AFTER the current position in the round order.
     null means every living player has had their turn this round. */
  nextLivingInOrder() {
    for (let k = this.orderIdx + 1; k < this.order.length; k++) {
      const p = players.byId(this.order[k]);
      if (p && p.alive) return { player: p, idx: players.list.indexOf(p), orderIdx: k };
    }
    return null;
  },

  beginTurn(idx) {
    this.cur = idx;
    const me = players.list[idx];
    this.orderIdx = this.order.indexOf(me.id);
    this.shotFired = false;
    this.turnSteps = 0;
    this.calmSteps = 0;
    this.resultSteps = 0;
    this.idleSinceMs = performance.now();
    this.hitChars.length = 0;
    this.shotPoints = 0;
    this.shotSelfHit = false;
    this.cpuShot = null;
    this.cpuSteps = 0;
    this.cpuPhase = me.kind === 'cpu' ? 'think' : null;

    /* The fall check at turn end measures against where each character was
       standing when the turn began, so record it for ALL of them, not just
       the shooter — anyone can be toppled by anyone's shot. */
    for (const ch of physics.characters) {
      if (!ch.eliminated) ch.turnStartY = ch.body.position.y;
    }

    physics.indexDirty = true;
    if (this.turnLog.length < 400) this.turnLog.push({ round: this.round, id: me.id });
    this.setState(STATES.PLAYER_TURN);
  },

  /* ---- firing ---------------------------------------------------------- */

  /* The one place a projectile is ever spawned. Guarded by shotFired, which
     is what makes a turn exactly one shot for humans and bots alike.

     Note this does NOT check inputLocked: a CPU turn is locked for its whole
     duration by design and still has to fire. The pointer path keeps that
     guard — see fireShot() — so there is still exactly one route from a
     finger to a projectile, and it is still closed while the lock is set. */
  fire(vx, vy, speed) {
    if (state.curState !== STATES.PLAYER_TURN) return false;
    if (this.shotFired) return false;
    const ch = this.activeChar();
    if (!ch || ch.eliminated) return false;

    const p = aim.launchPoint(ch);
    physics.spawnProjectile(p.x, p.y, vx, vy);
    ch.facing = vx >= 0 ? 1 : -1;

    this.shotFired = true;
    this.turnSteps = 0;
    this.calmSteps = 0;
    this.shots++;
    state.inputLocked = true;
    this.cancelAim();
    audio.launch(speed);
    return true;
  },

  /* The single POINTER fire path. A no-op unless we are in PLAYER_TURN and
     unlocked. */
  fireShot() {
    if (state.curState !== STATES.PLAYER_TURN || state.inputLocked) return false;
    if (this.shotFired) return false;
    const ch = this.activeChar();
    if (!ch) return false;

    aim.update();
    if (!aim.shouldFire(aim.dragLen)) return false;   // cancel, turn not consumed
    return this.fire(aim.velX, aim.velY, aim.speed);
  },

  /* ---- the CPU turn ---------------------------------------------------- */
  cpuTick(stepsThisFrame) {
    const me = this.activePlayer();
    if (!me || me.kind !== 'cpu' || this.shotFired || !this.cpuPhase) return;
    this.cpuSteps += stepsThisFrame;

    if (this.cpuPhase === 'think') {
      if (this.cpuSteps * CONFIG.STEP_MS < CONFIG.CPU.thinkMs) return;
      const decision = cpu.decide(me.castleId, players.list.map(p => ({
        id: p.id, castleId: p.castleId, alive: p.alive,
      })));
      if (!decision) { this.endTurn(); return; }     // no living opponent left
      this.cpuShot = decision;
      /* Line up using the same dotted arc a human sees. The kid gets to
         watch the bot aim and miss. */
      const ch = this.activeChar();
      aim.setShot(decision.shot.vx, decision.shot.vy, decision.shot.speed);
      if (ch) aim.rebuildArc(ch);
      aim.active = true;
      this.cpuPhase = 'aim';
      this.cpuSteps = 0;
      return;
    }

    if (this.cpuPhase === 'aim') {
      if (this.cpuSteps * CONFIG.STEP_MS < CONFIG.CPU.aimMs) return;
      const shot = this.cpuShot.shot;
      this.cpuPhase = null;
      /* If the shot is refused — the only way that can happen is the bot's own
         character being culled off the world by a tower still settling from the
         previous turn — end the turn rather than sitting in PLAYER_TURN with
         cpuPhase cleared and shotFired false, which is a soft lock with no
         backstop: TURN_MAX_STEPS only counts once a shot has been fired. */
      if (!this.fire(shot.vx, shot.vy, shot.speed)) this.endTurn();
    }
  },

  /* ---- scoring and damage --------------------------------------------- */

  /* Points, with the reason, per the plan's table. Tracked at M2 so the
     ROUND_MAX tiebreak is real; the floating labels and the HUD that show
     them are M3. Hitting your OWN castle or character scores 0 — never
     negative. */
  scoreFor(e) {
    const S = CONFIG.SCORE;
    if (e.type === 'blockHit') {
      if (!e.destroyed) return S.blockHit;
      return e.rec.mat === 'stone' ? S.stoneKill : S.woodKill;
    }
    if (e.type === 'charHit') return S.charHit;
    if (e.type === 'knockout') return S.knockout;
    return 0;
  },

  award(e, ownCastle) {
    const me = this.activePlayer();
    if (!me) return;
    if (ownCastle) {
      /* 0 OOPS!, never negative. The physics are still real: a self-hit
         costs a heart exactly as an opponent's would, which is the only
         reason the CPU silly shot is funny. */
      if (!this.shotSelfHit) { this.shotSelfHit = true; me.stats.selfHits += 1; }
      return;
    }
    const pts = this.scoreFor(e);
    if (pts <= 0) return;
    players.addScore(me, pts);
    this.shotPoints += pts;
    if (this.shotPoints > me.stats.bestShotDamage) me.stats.bestShotDamage = this.shotPoints;
  },

  /* Drain what physics recorded and decide who gets told. */
  drain() {
    const q = physics.queue;
    for (let i = 0; i < q.length; i++) {
      const e = q[i];
      if (e.type === 'blockHit') {
        audio.boom(e.impact);
        render.shake(clamp(e.impact / 12, 2, 10));
        this.award(e, e.rec.castleId === this.cur);
      } else if (e.type === 'charHit') {
        audio.boom(e.impact);
        render.shake(8);
        const isSelf = e.rec.castleId === this.cur;
        if (this.hitChars.indexOf(e.rec.playerId) < 0) this.hitChars.push(e.rec.playerId);
        this.award(e, isSelf);
      } else if (e.type === 'charCulled') {
        /* Culled off-screen entirely: immediate elimination, regardless of
           hearts. */
        const p = this.stressLoop ? null : players.byId(e.rec.playerId);
        if (p && p.alive) {
          players.eliminate(p);
          this.onEliminated(p, e.rec);
        }
      } else if (e.type === 'tap') {
        audio.thunk();
      }
    }
    q.length = 0;
  },

  onEliminated(p, chRec) {
    physics.removeCharacter(chRec);
    render.puff(chRec.body.position.x, chRec.body.position.y, p.color, chRec);
    /* No `killer.alive` clause: a shot that eliminates an opponent AND the
       shooter still earned the knockout, and resolveTurn's iteration order
       must not decide whether it counts. */
    const killer = this.activePlayer();
    if (killer && killer.id !== p.id) {
      players.addScore(killer, CONFIG.SCORE.knockout);
      this.shotPoints += CONFIG.SCORE.knockout;
      if (this.shotPoints > killer.stats.bestShotDamage) {
        killer.stats.bestShotDamage = this.shotPoints;
      }
    }
  },

  /* Everything that costs a heart is settled ONCE, here, at turn end.
     Per character per turn, at most one heart from (struck by the projectile
     OR fell) — they do not stack. Being culled off the world is separate and
     immediate, and is handled in drain(). */
  resolveTurn(costHearts) {
    for (const ch of physics.characters) {
      if (ch.eliminated) continue;
      const p = players.byId(ch.playerId);
      if (!p || !p.alive) continue;

      const fell = this.hasFallen(ch);
      if (fell) this.restand(ch);
      if (!costHearts) continue;

      const lost = playerRules.heartsLostThisTurn(this.hitChars.indexOf(p.id) >= 0, fell);
      if (lost <= 0) continue;
      if (players.loseHeart(p)) this.onEliminated(p, ch);
    }
  },

  /* Did this character fall? Measured against where it was STANDING when the
     turn began — see CONFIG.FALL_DY for why the plan's "below its platform's
     top surface" cannot be taken literally. Being knocked over in place is
     not a fall: it is stood back up for free. */
  hasFallen(ch) {
    const cas = physics.castles[ch.castleId];
    if (!cas) return false;
    const b = ch.body;
    if (physics.dynamicBodies.indexOf(b) < 0) return true;      // body already gone
    return playerRules.fell(b.position.y - ch.turnStartY, b.position.x, cas.footX0, cas.footX1);
  },

  /* Stood back up on whatever remains of its castle, or on the bare platform
     if the castle is gone. Also used for a character that is merely lying on
     its back, which costs nothing. */
  restand(ch) {
    const cas = physics.castles[ch.castleId];
    const b = ch.body;
    const gone = physics.dynamicBodies.indexOf(b) < 0;
    const topY = physics.standingTopY(ch.castleId);
    Body.setPosition(b, { x: cas.centreX, y: topY - CONFIG.CHARACTER.h / 2 - 1 });
    Body.setAngle(b, 0);
    Body.setVelocity(b, ZERO);
    Body.setAngularVelocity(b, 0);
    if (gone && !ch.eliminated) physics.addDynamic(b);
  },

  restandIfToppled() {
    for (const ch of physics.characters) {
      if (ch.eliminated) continue;
      if (Math.abs(normAngle(ch.body.angle)) > 1.0) this.restand(ch);
    }
  },

  /* ---- the frame ------------------------------------------------------- */

  /* Turn-end evaluation runs ONCE PER RENDERED FRAME, not once per physics
     step. The fixed step runs at 180 Hz; SETTLE_STEPS = 20 is 111 ms of
     simulated time, so a 60 Hz check still samples it 6-7 times. Same
     behaviour, a third of the work, zero allocation. */
  frame(stepsThisFrame) {
    this.drain();

    if (state.curState === STATES.ROUND_INTRO) {
      this.introSteps += stepsThisFrame;
      if (this.introSteps >= CONFIG.ROUND_INTRO_STEPS) this.endIntro();
      return;
    }

    if (state.curState === STATES.PLAYER_TURN) {
      if (!this.shotFired) { this.cpuTick(stepsThisFrame); return; }

      /* Every decision below routes through `turnRules`, which is what
         ?selftest=1 asserts. Do not reimplement these predicates inline: an
         earlier draft did, and the six turn-lifecycle assertions were then
         testing a parallel copy the game never ran, so breaking precondition
         1 here would have left the harness green. */

      // 4. Backstop, evaluated first so it always wins.
      if (turnRules.forceEnd(this.turnSteps)) {
        physics.forceQuiet();
        this.forcedEnds++;
        this.endTurn();
        return;
      }

      const hasProjectile = physics.projectile !== null;
      const sinceImpact = physics.stepCount - physics.lastImpactStep;

      /* Preconditions 1 and 2 also reset the calm counter: nothing counts as
         settled while a body is still in flight or a tower is mid-collapse. */
      const blocked = hasProjectile || sinceImpact < CONFIG.QUIET_AFTER_IMPACT_STEPS;
      this.calmSteps = blocked
        ? 0
        : turnRules.settleTick(this.calmSteps, physics.worldIsCalm(), stepsThisFrame);

      // 1 + 2 + 3, in one predicate.
      if (turnRules.canEndTurn(hasProjectile, sinceImpact, this.calmSteps)) this.endTurn();
      return;
    }

    if (state.curState === STATES.TURN_RESULT) {
      this.resultSteps += stepsThisFrame;
      if (this.resultSteps >= CONFIG.TURN_RESULT_STEPS) this.advance();
      return;
    }

    if (state.curState === STATES.ROUND_COMPLETE) {
      if (turnRules.afterRound(this.round) === STATES.FINAL_RESULTS) this.finish();
      else this.beginRound();
      return;
    }
  },

  /* The one exit from PLAYER_TURN. There is no other way out.
     Every heart, every elimination and the fall check are settled here,
     before any guard looks at who is still alive. */
  endTurn() {
    physics.removeProjectile();
    this.resolveTurn(!this.stressLoop);
    this.restandIfToppled();
    this.setState(STATES.TURN_RESULT);
    this.resultSteps = 0;
  },

  /* The guard order out of TURN_RESULT. Evaluated top to bottom, first match
     wins, and the order is the point: the end-of-match checks fire HERE and
     not at ROUND_COMPLETE. If the only human is knocked out on the first turn
     of a round in a 1-human/3-CPU match, an end-of-round check would let
     three bots take their turns first — an empty room watching itself play. */
  advance() {
    if (this.stressLoop) { this.beginTurn(0); return; }
    const next = this.nextLivingInOrder();
    const decision = turnRules.nextState({
      aliveCount: players.living().length,
      livingHumans: players.livingHumans().length,
      nextKind: next ? next.player.kind : null,
    });

    if (decision === STATES.FINAL_RESULTS) { this.finish(); return; }
    if (decision === STATES.ROUND_COMPLETE || !next) {
      /* `!next` is unreachable while nextState maps a null nextKind to
         ROUND_COMPLETE, and it is here anyway: dereferencing next.idx would
         throw inside the rAF loop and take the whole game with it, which is
         strictly worse than rolling the round over. */
      this.setState(STATES.ROUND_COMPLETE);
      return;
    }

    this.pendingIdx = next.idx;
    if (decision === STATES.PASS_DEVICE) this.setState(STATES.PASS_DEVICE);
    else this.beginTurn(next.idx);
  },

  /* "I'M READY" on the pass-device screen. The only way out of PASS_DEVICE. */
  ready() {
    if (state.curState !== STATES.PASS_DEVICE) return false;
    /* Physics keeps stepping behind the pass screen, so a tower can still be
       settling and a character can still be culled off the world while the
       tablet is being handed over. Re-run the guards rather than starting a
       turn for a player who is no longer in the match. */
    const p = players.list[this.pendingIdx];
    if (!p || !p.alive) { this.advance(); return true; }
    this.beginTurn(this.pendingIdx);
    return true;
  },

  pause() {
    if (state.curState !== STATES.PLAYER_TURN) return false;
    this.setState(STATES.PAUSED);
    return true;
  },

  resume() {
    if (state.curState !== STATES.PAUSED) return false;
    /* Re-enters PLAYER_TURN, which is exactly why setState's in-flight clause
       exists: the lock must NOT clear while the paused shot is still
       travelling. */
    this.setState(STATES.PLAYER_TURN);
    this.idleSinceMs = performance.now();
    return true;
  },

  finish() {
    const w = players.winner();
    this.winnerId = w ? w.id : null;
    this.setState(STATES.FINAL_RESULTS);
  },

  /* Play Again: reset scores, hearts and castles; KEEP the slots.
     New Game and Home need the setup and home screens, so they are M3. */
  playAgain() {
    if (state.curState !== STATES.FINAL_RESULTS) return false;
    players.resetMatch();
    physics.build(players.list.length,
                  { characterIds: players.list.map(p => p.characterId) });
    render.clearPuffs();
    this.startMatch();
    return true;
  },

  step() { if (this.shotFired) this.turnSteps++; },
};

/* Pure helpers, factored out so ?selftest=1 can assert them directly. */
const turnRules = {
  settleTick(calmSteps, isCalm, stepsThisFrame) { return isCalm ? calmSteps + stepsThisFrame : 0; },
  isSettled(calmSteps) { return calmSteps >= CONFIG.SETTLE_STEPS; },
  forceEnd(turnSteps) { return turnSteps >= CONFIG.TURN_MAX_STEPS; },
  /* Precondition 1, as a predicate: a turn cannot end while a projectile
     body exists, no matter how calm the world looks. */
  canEndTurn(hasProjectile, stepsSinceImpact, calmSteps) {
    if (hasProjectile) return false;
    if (stepsSinceImpact < CONFIG.QUIET_AFTER_IMPACT_STEPS) return false;
    return this.isSettled(calmSteps);
  },

  /* The TURN_RESULT guard table, in the plan's order. Top to bottom, first
     match wins, and the ORDER is the whole point:

       1  no living human, or one player left  -> FINAL_RESULTS
       2  nobody left to play this round       -> ROUND_COMPLETE
       3  next living player is HUMAN          -> PASS_DEVICE
       4  next living player is CPU            -> PLAYER_TURN

     Rule 1 sits above rule 2 so the end-of-match check fires at TURN_RESULT
     rather than waiting for the round to roll over. In a 1-human/3-CPU match
     where the human is knocked out on the first turn of a round, an
     end-of-round check would let three bots take their turns first — an
     empty room watching itself play. That is the case this ordering exists
     for, and it is asserted directly in ?selftest=1. */
  nextState(ctx) {
    if (ctx.aliveCount <= 1 || ctx.livingHumans === 0) return STATES.FINAL_RESULTS;
    if (!ctx.nextKind) return STATES.ROUND_COMPLETE;
    return this.needsPass(ctx.nextKind, ctx.livingHumans) ? STATES.PASS_DEVICE : STATES.PLAYER_TURN;
  },

  /* M2 CORRECTION. The plan's guard table says PASS_DEVICE whenever the next
     living player is HUMAN, and P3 says in the same breath that "a solo game
     never shows one". Both cannot be true: with one human and three bots the
     table puts a PASS THE TABLET TO PLAYER 1 screen in front of the only
     person in the room, once per round, forever.

     The screen exists for one job — the tablet changing hands — so the test
     is whether it can. It cannot while only one human is still alive, and
     that covers the solo case at match start AND the case where a 2-human
     match loses one of them halfway through and the survivor should just
     keep playing. */
  needsPass(nextKind, livingHumans) {
    return nextKind === 'human' && livingHumans > 1;
  },

  /* ROUND_COMPLETE. ROUND_MAX is a safety net; with hearts scaling down at 3
     and 4 players a match should end long before it, and the match then
     resolves on points. */
  afterRound(round) {
    return round >= CONFIG.ROUND_MAX ? STATES.FINAL_RESULTS : STATES.ROUND_INTRO;
  },

  /* ROUND_INTRO branches on the SAME human/CPU test as nextState, because
     round rollover bypasses the pass-device guard entirely. Without it a
     2-human match opens each new round with the wrong person holding the
     tablet. */
  afterIntro(firstKind, livingHumans) {
    return this.needsPass(firstKind, livingHumans) ? STATES.PASS_DEVICE : STATES.PLAYER_TURN;
  },
};

/* The health model, as predicates. Same discipline as `turnRules`: the game
   calls these, and ?selftest=1 asserts these. A parallel copy that only the
   harness runs is worse than no test at all. */
const playerRules = {
  heartsFor(playerCount) { return CONFIG.HEARTS[playerCount] || 3; },

  /* At most ONE heart per character per turn. Struck by the projectile AND
     toppled off the castle in the same turn is one heart, not two — the plan
     is explicit that they do not stack. */
  heartsLostThisTurn(wasHit, fell) { return (wasHit || fell) ? 1 : 0; },

  /* Did the character fall? `dropPx` is how far it ended up BELOW where it
     was standing when the turn began; footX0/footX1 are its own castle's
     footprint. See CONFIG.FALL_DY for why the reference is the standing
     height and not the platform top. */
  fell(dropPx, x, footX0, footX1) {
    if (dropPx > CONFIG.FALL_DY) return true;
    return x < footX0 - CONFIG.FALL_SLICE_PAD || x > footX1 + CONFIG.FALL_SLICE_PAD;
  },

  /* Culled past the world bounds entirely is elimination regardless of how
     many hearts are left. There is nothing to stand back up. */
  cullIsElimination() { return true; },
};

/* ========================================================== render =======
   Reads state, never mutates it. Never allocates per frame.
   ======================================================================== */
const render = {
  skyGrad: null,
  shakeMag: 0, shakeUntil: 0,
  hintAlpha: 0,

  /* The DEFAULT half of the plan's `reduceMotion`, landing here rather than at
     M3 because it is an OS signal and needs no UI: screen shake is a real
     vestibular trigger and honouring the media query costs nothing. M3 adds
     the persisted parent override on top of this.

     It disables SHAKE ONLY (and, at M4, confetti). Trajectory dots, block
     motion and the elimination wobble all carry game information and stay —
     the plan is explicit about that. Read once; the query is stable enough
     that re-reading per frame would be pure overhead. */
  reduceMotion: (() => {
    try { return !!(window.matchMedia &&
                    window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
    catch (e) { return false; }
  })(),

  /* Fixed pool. `render` never allocates per frame, and an elimination can
     fire at most once per player per match. */
  puffs: [
    { on: false, x: 0, y: 0, t0: 0, color: '#fff', charId: 'nim', facing: 1 },
    { on: false, x: 0, y: 0, t0: 0, color: '#fff', charId: 'nim', facing: 1 },
    { on: false, x: 0, y: 0, t0: 0, color: '#fff', charId: 'nim', facing: 1 },
    { on: false, x: 0, y: 0, t0: 0, color: '#fff', charId: 'nim', facing: 1 },
  ],

  invalidate() { this.skyGrad = null; },
  shake(mag) {
    if (this.reduceMotion) return;
    this.shakeMag = Math.max(this.shakeMag, mag);
    this.shakeUntil = performance.now() + 220;
  },

  /* "Eliminated characters leave with a puff and a wobble, never an injury
     animation." The BODY is already gone by the time this is called — `turns`
     removes it so the settle predicate and the turn guards never see a corpse
     — so the wobble is drawn from the recorded silhouette, not simulated. That
     keeps the exit purely cosmetic and unable to affect the match. */
  puff(x, y, color, chRec) {
    let slot = null;
    for (const q of this.puffs) { if (!q.on) { slot = q; break; } }
    if (!slot) slot = this.puffs[0];
    slot.on = true; slot.x = x; slot.y = y; slot.color = color;
    slot.charId = (chRec && chRec.characterId) || 'nim';
    slot.facing = (chRec && chRec.facing) || 1;
    slot.t0 = performance.now();
  },
  clearPuffs() { for (const q of this.puffs) q.on = false; },

  frame(nowMs) {
    const ctx = view.ctx;
    const W = view.canvas.width, H = view.canvas.height;

    // Letterbox bars first, in device pixels, covering the whole backing store.
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = CONFIG.COLOR.letterbox;
    ctx.fillRect(0, 0, W, H);

    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.save();
    ctx.translate(view.offX, view.offY);
    ctx.scale(view.scale, view.scale);

    // Screen shake — world-space, so it never leaks into the letterbox bars.
    let sx = 0, sy = 0;
    if (nowMs < this.shakeUntil && this.shakeMag > 0) {
      const t = (this.shakeUntil - nowMs) / 220;
      sx = (Math.random() * 2 - 1) * this.shakeMag * t;
      sy = (Math.random() * 2 - 1) * this.shakeMag * t;
    } else { this.shakeMag = 0; }

    ctx.beginPath();
    ctx.rect(0, 0, CONFIG.WORLD_W, CONFIG.WORLD_H);
    ctx.clip();
    ctx.translate(sx, sy);

    this.drawSky(ctx);
    this.drawGround(ctx);
    for (let i = 0; i < physics.blocks.length; i++) this.drawBlock(ctx, physics.blocks[i]);
    for (let i = 0; i < physics.characters.length; i++) {
      const rec = physics.characters[i];
      if (rec.eliminated) continue;
      this.drawCharacter(ctx, rec);
      this.drawHearts(ctx, rec);
    }
    const activeCh = turns.activeChar();
    if (activeCh && !activeCh.eliminated && state.curState === STATES.PLAYER_TURN) {
      this.drawSling(ctx, activeCh);
      this.drawTurnMarker(ctx, activeCh, nowMs);
    }
    if (aim.active && aim.arcN > 0) { this.drawBand(ctx); this.drawArc(ctx); }
    if (physics.projectile) this.drawProjectile(ctx, physics.projectile);
    this.drawPuffs(ctx, nowMs);
    this.drawHint(ctx, nowMs);
    this.drawBanner(ctx);

    ctx.restore();
  },

  drawSky(ctx) {
    if (!this.skyGrad) {
      this.skyGrad = ctx.createLinearGradient(0, 0, 0, CONFIG.WORLD_H);
      this.skyGrad.addColorStop(0, CONFIG.COLOR.sky0);
      this.skyGrad.addColorStop(1, CONFIG.COLOR.sky1);
    }
    ctx.fillStyle = this.skyGrad;
    ctx.fillRect(0, 0, CONFIG.WORLD_W, CONFIG.WORLD_H);
  },

  /* Base ground first, then the stepped platforms on top of it, so the
     platform outlines sit over the ground rather than under it. */
  drawGround(ctx) {
    for (let i = 0; i < physics.ground.length; i++) {
      const g = physics.ground[i].plan;
      if (g.platform) continue;
      this.drawSlab(ctx, g, 4);
    }
    for (let i = 0; i < physics.ground.length; i++) {
      const g = physics.ground[i].plan;
      if (!g.platform) continue;
      this.drawSlab(ctx, g, 4);
    }
  },

  drawSlab(ctx, g, lw) {
    ctx.fillStyle = CONFIG.COLOR.dirt;
    ctx.fillRect(g.x, g.y, g.w, g.h);
    ctx.fillStyle = CONFIG.COLOR.grass;
    ctx.fillRect(g.x, g.y, g.w, 10);
    ctx.strokeStyle = CONFIG.COLOR.ink;
    ctx.lineWidth = lw;
    ctx.strokeRect(g.x - 2, g.y, g.w + 4, g.h);
  },

  drawBlock(ctx, rec) {
    const b = rec.body;
    const w = CONFIG.BLOCK.w, h = CONFIG.BLOCK.h;
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(b.angle);
    roundRect(ctx, -w / 2, -h / 2, w, h, 7);
    ctx.fillStyle = rec.mat === 'stone' ? CONFIG.COLOR.stone : CONFIG.COLOR.wood;
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    roundRect(ctx, -w / 2 + 4, -h / 2 + 4, w - 8, h / 3, 4); ctx.fill();
    /* A stone block that has taken one of its two hits shows a crack, so
       "it did not break" reads as progress rather than as nothing happening. */
    if (rec.hp < rec.maxHp) {
      ctx.strokeStyle = 'rgba(42,26,10,0.55)'; ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-w / 2 + 6, -h / 2 + 7);
      ctx.lineTo(-4, -2); ctx.lineTo(5, 4); ctx.lineTo(w / 2 - 6, h / 2 - 8);
      ctx.stroke();
    }
    ctx.fillStyle = CONFIG.COLOR.ink;
    ctx.font = '24px "Lilita One", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(rec.label, 0, 2);
    ctx.strokeStyle = CONFIG.COLOR.ink; ctx.lineWidth = 3;
    roundRect(ctx, -w / 2, -h / 2, w, h, 7); ctx.stroke();
    ctx.restore();
  },

  /* TWO silhouettes, not four: a "kid" and a visibly different "robot", so a
     non-reader can tell a human slot from a CPU slot at a glance. They are
     tinted by the slot colour and have NO mechanical differences. Four
     distinct shapes was four times the art for zero gameplay difference; the
     human/robot distinction is the only one that carries information.

     Facing is a RENDER concern only — the gesture is already symmetric, so
     nothing about aiming is mirrored. */
  drawCharacter(ctx, rec) {
    const b = rec.body;
    const col = CONFIG.COLOR.players[rec.castleId % CONFIG.COLOR.players.length];
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(b.angle);
    ctx.scale(rec.facing, 1);
    this.drawSilhouette(ctx, rec.characterId, col);
    ctx.restore();
  },

  /* Drawn at the origin, in whatever transform the caller has set up. Factored
     out so the live character and the elimination wobble are the SAME art —
     an eliminated player must not leave as a different-looking creature. */
  drawSilhouette(ctx, characterId, col) {
    const w = CONFIG.CHARACTER.w, h = CONFIG.CHARACTER.h;

    // Raised arm FIRST so it sits behind the head — drawn after, its outline
    // cut a line straight across the face.
    ctx.lineCap = 'round';
    ctx.strokeStyle = CONFIG.COLOR.ink; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(6, -h / 2 + 20); ctx.lineTo(17, -h / 2 - 2); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.moveTo(6, -h / 2 + 20); ctx.lineTo(17, -h / 2 - 2); ctx.stroke();

    // body
    roundRect(ctx, -w / 2, -h / 2 + 12, w, h - 12, characterId === 'bolt' ? 4 : 9);
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = CONFIG.COLOR.ink; ctx.lineWidth = 3; ctx.stroke();

    if (characterId === 'bolt') this.drawRobotHead(ctx, h);
    else this.drawKidHead(ctx, h);
  },

  drawKidHead(ctx, h) {
    ctx.beginPath(); ctx.arc(0, -h / 2 + 8, 13, 0, Math.PI * 2);
    ctx.fillStyle = CONFIG.COLOR.cream; ctx.fill(); ctx.stroke();
    ctx.fillStyle = CONFIG.COLOR.ink;
    ctx.beginPath(); ctx.arc(4, -h / 2 + 6, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-3, -h / 2 + 6, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = CONFIG.COLOR.ink; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0.5, -h / 2 + 10, 4.5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  },

  /* Square head, antenna, visor bar. Reads as "not a person" from across a
     room, which is the entire job. */
  drawRobotHead(ctx, h) {
    const cy = -h / 2 + 8;
    ctx.strokeStyle = CONFIG.COLOR.ink; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, cy - 12); ctx.lineTo(0, cy - 19); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, cy - 21, 3.2, 0, Math.PI * 2);
    ctx.fillStyle = CONFIG.COLOR.gold; ctx.fill(); ctx.stroke();

    roundRect(ctx, -12, cy - 12, 24, 23, 5);
    ctx.fillStyle = CONFIG.COLOR.cream; ctx.fill(); ctx.stroke();
    roundRect(ctx, -8.5, cy - 7, 17, 8, 3);
    ctx.fillStyle = CONFIG.COLOR.ink; ctx.fill();
    ctx.fillStyle = CONFIG.COLOR.gold;
    ctx.beginPath(); ctx.arc(-4, cy - 3, 1.9, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, cy - 3, 1.9, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = CONFIG.COLOR.ink; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-5, cy + 6); ctx.lineTo(5, cy + 6); ctx.stroke();
  },

  /* Heart pips, in world space above the character. COUNTABLE, never a bar.
     This is not the DOM HUD — that is M3, and it shows only the ACTIVE
     player's hearts. Every character wearing its own hearts is what makes a
     3- or 4-player board readable without one. */
  drawHearts(ctx, rec) {
    const p = players.byId(rec.playerId);
    if (!p || !p.alive) return;
    const b = rec.body;
    const n = p.hearts;
    if (n <= 0) return;
    const gap = 17;
    const y = b.bounds.min.y - 16;
    const x0 = b.position.x - ((n - 1) * gap) / 2;
    for (let i = 0; i < n; i++) this.drawHeart(ctx, x0 + i * gap, y, 7, p.color);
  },

  drawHeart(ctx, x, y, r, col) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, r * 0.9);
    ctx.bezierCurveTo(-r * 1.6, -r * 0.35, -r * 0.6, -r * 1.35, 0, -r * 0.45);
    ctx.bezierCurveTo(r * 0.6, -r * 1.35, r * 1.6, -r * 0.35, 0, r * 0.9);
    ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = CONFIG.COLOR.ink; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  },

  /* Whose turn it is, without a HUD: a bobbing chevron in the active
     player's colour. The DOM current-player pill lands at M3. */
  drawTurnMarker(ctx, rec, nowMs) {
    const p = players.byId(rec.playerId);
    if (!p) return;
    /* Clear ABOVE the slingshot. The sling is drawn from the launch point
       (bounds.min.y - SPAWN_OFFSET_Y) with prongs another 15 px up, and the
       heart pips sit just over the head — a marker at 34 landed inside the
       sling's fork and read as part of the slingshot rather than as "you". */
    const bob = Math.sin(nowMs / 320) * 4;
    const x = rec.body.position.x;
    const y = rec.body.bounds.min.y - CONFIG.SPAWN_OFFSET_Y - 38 + bob;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x, y + 13); ctx.lineTo(x - 11, y - 3); ctx.lineTo(x + 11, y - 3);
    ctx.closePath();
    ctx.fillStyle = p.color; ctx.fill();
    ctx.strokeStyle = CONFIG.COLOR.ink; ctx.lineWidth = 3; ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.restore();
  },

  drawPuffs(ctx, nowMs) {
    for (const q of this.puffs) {
      if (!q.on) continue;
      const ms = nowMs - q.t0;
      const t = ms / CONFIG.ELIM_PUFF_MS;
      if (t >= 1) { q.on = false; continue; }

      /* Smoke FIRST, so it billows out from BEHIND the character. Drawn over
         the top it just erases them, and the wobble the plan asks for is
         invisible under a 5-circle cloud. */
      ctx.save();
      ctx.globalAlpha = 1 - t;
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2 + t * 1.4;
        const d = 8 + t * 46;
        ctx.beginPath();
        ctx.arc(q.x + Math.cos(a) * d, q.y + Math.sin(a) * d * 0.75, 13 * (1 - t * 0.55), 0, Math.PI * 2);
        ctx.fillStyle = q.color; ctx.fill();
        ctx.strokeStyle = CONFIG.COLOR.ink; ctx.lineWidth = 2.5; ctx.stroke();
      }
      ctx.restore();

      /* Then the wobble on top: the character rocks, shrinks and fades out
         through the smoke. Never an injury animation — the same cheerful
         silhouette, just leaving. Runs shorter than the puff, so the smoke
         outlives the kid rather than the other way round. */
      if (ms < CONFIG.ELIM_WOBBLE_MS) {
        const w = ms / CONFIG.ELIM_WOBBLE_MS;
        ctx.save();
        ctx.globalAlpha = 1 - w * w;
        ctx.translate(q.x, q.y + w * 10);
        ctx.rotate(Math.sin(w * Math.PI * 5) * 0.45 * (1 - w));
        ctx.scale((1 - w * 0.35) * q.facing, 1 - w * 0.35);
        this.drawSilhouette(ctx, q.charId, q.color);
        ctx.restore();
      }
    }
  },

  /* ROUND N, for the 0.6 s ROUND_INTRO beat. Canvas, not DOM: the round pill
     that lives permanently in the HUD is M3. */
  drawBanner(ctx) {
    if (state.curState !== STATES.ROUND_INTRO) return;
    const t = clamp(turns.introSteps / CONFIG.ROUND_INTRO_STEPS, 0, 1);
    ctx.save();
    ctx.globalAlpha = t < 0.8 ? 1 : (1 - (t - 0.8) / 0.2);
    ctx.fillStyle = 'rgba(26,37,85,0.72)';
    ctx.fillRect(0, CONFIG.WORLD_H / 2 - 62, CONFIG.WORLD_W, 124);
    ctx.font = '72px "Lilita One", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 8; ctx.strokeStyle = CONFIG.COLOR.ink; ctx.lineJoin = 'round';
    ctx.strokeText('ROUND ' + turns.round, CONFIG.WORLD_W / 2, CONFIG.WORLD_H / 2);
    ctx.fillStyle = CONFIG.COLOR.gold;
    ctx.fillText('ROUND ' + turns.round, CONFIG.WORLD_W / 2, CONFIG.WORLD_H / 2);
    ctx.restore();
  },

  /* The slingshot itself, drawn in WORLD space (not the character's rotated
     frame) so the fork lands exactly on the launch point the physics uses.
     Always visible during a turn: it is the only thing on screen that tells a
     non-reader what this game wants from them. */
  drawSling(ctx, rec) {
    const p = aim.launchPoint(rec);
    const b = rec.body;
    const hand = { x: b.position.x + 9 * rec.facing, y: b.bounds.min.y + 2 };
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#7a4a20'; ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(hand.x, hand.y); ctx.lineTo(p.x, p.y);        // handle
    ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 11, p.y - 15);    // left prong
    ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 11, p.y - 15);    // right prong
    ctx.stroke();
    ctx.strokeStyle = '#4a2c12'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(hand.x, hand.y); ctx.lineTo(p.x, p.y);
    ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 11, p.y - 15);
    ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 11, p.y - 15);
    ctx.stroke();
    ctx.restore();
  },

  /* The slingshot band is DRAWN, never simulated with a Constraint. A
     MouseConstraint against an elastic Constraint makes release velocity
     emergent from a spring, which is exactly what makes an accurate preview
     impossible. */
  drawBand(ctx) {
    const ch = turns.activeChar(); if (!ch) return;
    const p = aim.launchPoint(ch);
    const pull = Math.min(aim.dragLen * 0.32, 52);
    const bx = p.x - aim.dirX * pull, by = p.y - aim.dirY * pull;

    // Bands run from the prong tips drawn in drawSling() to the pouch.
    ctx.strokeStyle = '#c2703a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(p.x - 11, p.y - 15); ctx.lineTo(bx, by);
    ctx.moveTo(p.x + 11, p.y - 15); ctx.lineTo(bx, by);
    ctx.stroke();

    ctx.beginPath(); ctx.arc(bx, by, CONFIG.PROJECTILE.radius * 0.8, 0, Math.PI * 2);
    ctx.fillStyle = CONFIG.COLOR.ball; ctx.fill();
    ctx.strokeStyle = CONFIG.COLOR.ink; ctx.lineWidth = 3; ctx.stroke();

    // power pip: how full the pull is, drawn as a ring that fills with gold
    const t = clamp(aim.dragLen / CONFIG.MAX_DRAG, 0, 1);
    ctx.beginPath();
    ctx.arc(bx, by, CONFIG.PROJECTILE.radius * 1.5, -Math.PI / 2, -Math.PI / 2 + t * Math.PI * 2);
    ctx.strokeStyle = CONFIG.COLOR.gold; ctx.lineWidth = 4; ctx.stroke();
  },

  drawArc(ctx) {
    const a = aim.arcXY, n = aim.arcN;
    ctx.fillStyle = CONFIG.COLOR.cream;
    ctx.strokeStyle = CONFIG.COLOR.ink;
    ctx.lineWidth = 2;
    for (let i = CONFIG.ARC_DOT_EVERY - 1; i < n; i += CONFIG.ARC_DOT_EVERY) {
      const r = 4.5 - 2.2 * (i / n);
      ctx.beginPath();
      ctx.arc(a[i * 2], a[i * 2 + 1], r, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    }
  },

  drawProjectile(ctx, p) {
    const r = CONFIG.PROJECTILE.radius;
    ctx.save();
    ctx.translate(p.position.x, p.position.y);
    ctx.rotate(p.angle);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = CONFIG.COLOR.ball; ctx.fill();
    ctx.strokeStyle = CONFIG.COLOR.ink; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.35, r * 0.26, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill();
    ctx.restore();
  },

  /* In-world nudge, not a HUD. The M1 exit gate is a 4-year-old firing a
     shot inside 30 seconds with nobody explaining anything. */
  drawHint(ctx, nowMs) {
    const show = state.curState === STATES.PLAYER_TURN && !state.inputLocked &&
                 !aim.active && (nowMs - turns.idleSinceMs) > CONFIG.HINT_IDLE_MS;
    this.hintAlpha += ((show ? 1 : 0) - this.hintAlpha) * 0.08;
    if (this.hintAlpha < 0.02) return;
    const ch = turns.activeChar(); if (!ch) return;
    const p = aim.launchPoint(ch);
    const t = (nowMs % 1600) / 1600;
    const d = 30 + t * 70;

    ctx.save();
    ctx.globalAlpha = this.hintAlpha * (1 - t * 0.6);
    ctx.strokeStyle = CONFIG.COLOR.gold; ctx.lineWidth = 5;
    ctx.setLineDash([9, 9]); ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - d * 0.75, p.y + d * 0.55);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(p.x - d * 0.75, p.y + d * 0.55, 13, 0, Math.PI * 2);
    ctx.fillStyle = CONFIG.COLOR.gold; ctx.fill();
    ctx.strokeStyle = CONFIG.COLOR.ink; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
  },
};

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y,     x + w, y + h, r);
  c.arcTo(x + w, y + h, x,     y + h, r);
  c.arcTo(x,     y + h, x,     y,     r);
  c.arcTo(x,     y,     x + w, y,     r);
  c.closePath();
}

/* ============================================================== ui =======
   Emits actions downward into `turns`. Never mutates game state directly.
   ======================================================================== */
const ui = {
  /* What the DOM currently reflects. Three fields rather than the state
     alone: turns.ready() can re-enter PASS_DEVICE with a DIFFERENT pending
     player (the one it was waiting on was culled off the world while the
     tablet was being handed over), and comparing only curState would skip
     the re-sync — leaving the old player on the badge and I'M READY disabled
     from the tap that got us here, with no way out. */
  lastState: null,
  lastPending: -1,
  lastWinner: -1,
  btnArmedAt: 0,

  attach() {
    const c = view.canvas;
    c.addEventListener('pointerdown', this.onDown, { passive: false });
    c.addEventListener('pointermove', this.onMove, { passive: false });
    window.addEventListener('pointerup', this.onUp, { passive: false });
    window.addEventListener('pointercancel', this.onUp, { passive: false });
    window.addEventListener('resize', () => view.resize());
    window.addEventListener('orientationchange', () => setTimeout(() => view.resize(), 60));

    /* Overlay buttons get a BUTTON_DEBOUNCE_MS window plus immediate
       self-disable on first activation, because a 4-year-old double-taps
       everything and the second tap must not reach the next screen. */
    this.bind('pass-btn', () => turns.ready());
    this.bind('resume-btn', () => turns.resume());
    this.bind('again-btn', () => turns.playAgain());
    this.bind('pause-btn', () => turns.pause(), true);

    // Audio unlock — WebAudio is silent on iOS until resumed inside a gesture.
    ['pointerdown', 'touchstart', 'keydown'].forEach(ev =>
      document.addEventListener(ev, () => audio.ensure(), { once: true, passive: true }));

    // Never let a tab stall dump a huge backlog into the accumulator.
    document.addEventListener('visibilitychange', () => { loopState.lastT = 0; });
  },

  /* One handler shape for every overlay button. `instant` skips the arming
     window for the pause button, which is not an overlay button and is not
     the thing a double-tap can skip past. */
  bind(id, action, instant) {
    const el = $(id);
    if (!el) return;
    el.addEventListener('click', (ev) => {
      ev.preventDefault();
      if (el.disabled) return;
      if (!instant && performance.now() - ui.btnArmedAt < CONFIG.BUTTON_DEBOUNCE_MS) return;
      el.disabled = true;                       // self-disable on first activation
      audio.ensure();                           // the gesture that unlocks iOS audio
      action();
    });
  },

  /* `ui` reads state and shows the matching overlay. It never mutates game
     state: every button above emits an intent into `turns`, which owns the
     transition. Runs once per frame but only touches the DOM when the state
     actually changed — otherwise this is a per-frame layout thrash. */
  syncOverlays() {
    const st = state.curState;
    if (st === this.lastState && turns.pendingIdx === this.lastPending &&
        turns.winnerId === this.lastWinner) return;
    this.lastState = st;
    this.lastPending = turns.pendingIdx;
    this.lastWinner = turns.winnerId;
    this.btnArmedAt = performance.now();

    $('pass').hidden   = st !== STATES.PASS_DEVICE;
    $('paused').hidden = st !== STATES.PAUSED;
    $('final').hidden  = st !== STATES.FINAL_RESULTS;
    $('pause-btn').hidden = st !== STATES.PLAYER_TURN;

    const passBtn = $('pass-btn'), resumeBtn = $('resume-btn'), againBtn = $('again-btn');
    if (passBtn) passBtn.disabled = false;
    if (resumeBtn) resumeBtn.disabled = false;
    if (againBtn) againBtn.disabled = false;

    if (st === STATES.PASS_DEVICE) {
      const p = players.list[turns.pendingIdx];
      if (p) {
        $('pass-num').textContent = String(p.id);
        $('pass-badge').style.background = p.color;
        $('pass-name').textContent = p.name;
      }
    } else if (st === STATES.FINAL_RESULTS) {
      const w = players.byId(turns.winnerId);
      if (w) {
        $('final-num').textContent = String(w.id);
        $('final-badge').style.background = w.color;
        $('final-name').textContent = w.name;
        $('final-title').textContent = w.kind === 'cpu' ? 'THE ROBOT WINS' : 'WINNER';
      }
    }
  },

  inActiveSlice(wx, wy) {
    const n = players.list.length;
    const s = world.slice(n, turns.cur);
    return wx >= s.x0 && wx <= s.x1 && wy >= 0 && wy <= CONFIG.WORLD_H;
  },

  onDown(ev) {
    if (state.inputLocked || state.curState !== STATES.PLAYER_TURN) return;
    if (aim.pointerId !== null) return;           // ignore a second finger
    const p = view.toWorld(ev.clientX, ev.clientY);
    if (!ui.inActiveSlice(p.x, p.y)) return;
    aim.pointerId = ev.pointerId;
    aim.active = true;
    aim.startX = p.x; aim.startY = p.y;
    aim.curX = p.x;   aim.curY = p.y;
    aim.dirty = true;
    turns.idleSinceMs = performance.now();
    if (ev.cancelable) ev.preventDefault();
    try { view.canvas.setPointerCapture(ev.pointerId); } catch (e) {}
  },

  /* The arc is recomputed AT MOST ONCE PER ANIMATION FRAME, not per
     pointermove. touchmove fires 60-120 times a second on an iPad. */
  onMove(ev) {
    if (!aim.active || ev.pointerId !== aim.pointerId) return;
    const p = view.toWorld(ev.clientX, ev.clientY);
    aim.curX = p.x; aim.curY = p.y;
    aim.dirty = true;
    if (ev.cancelable) ev.preventDefault();
  },

  onUp(ev) {
    if (!aim.active || ev.pointerId !== aim.pointerId) return;
    const p = view.toWorld(ev.clientX, ev.clientY);
    aim.curX = p.x; aim.curY = p.y;
    aim.pointerId = null;
    aim.update();
    if (aim.shouldFire(aim.dragLen)) {
      turns.fireShot();
    } else {
      aim.active = false;                 // cancelled; the turn is not consumed
      aim.arcN = 0;
      turns.idleSinceMs = performance.now();
    }
    if (ev.cancelable) ev.preventDefault();
  },
};

/* ============================================================ loop =======
   FIXED TIMESTEP. One rate, always: STEP_MS = 16.666 / 3 = 5.5555.
   Accumulator-driven, decoupled from requestAnimationFrame, three steps per
   60 Hz frame, capped at MAX_STEPS_PER_FRAME to avoid a death spiral.

   There is NO conditional substepping. Matter applies gravity as a force
   scaled by deltaTime^2, so a step rate that changes mid-flight changes the
   trajectory, and positionIterations/velocityIterations are per-Engine.update
   so towers would solve stiffer while a shot is airborne than while they
   settle. crane-stacker/index.html:790,795 passes a variable dt. Not here.
   ======================================================================== */
const loopState = { lastT: 0, acc: 0, stepsThisFrame: 0 };

/* Frame instrumentation for the M1 performance gate.
   `frame` is the rAF interval, which is vsync-locked and therefore only
   answers "are we holding 60 Hz". `work` is the number the body budget is
   actually judged against: time spent inside the loop — physics steps plus
   turn evaluation plus the draw — which is what has headroom or does not.
   Only sampled under ?perf=1. */
const perf = {
  el: $('perf'),
  lastPaint: 0,
  ring(n) { return { buf: new Float64Array(n), idx: 0, filled: 0 }; },
  frame: null, work: null, phys: null, draw: null,
  init() {
    this.frame = this.ring(180); this.work = this.ring(180);
    this.phys = this.ring(180); this.draw = this.ring(180);
  },
  put(r, ms) { r.buf[r.idx] = ms; r.idx = (r.idx + 1) % r.buf.length; if (r.filled < r.buf.length) r.filled++; },
  push(ms) { this.put(this.frame, ms); },
  statsOf(r) {
    const n = r.filled; if (!n) return null;
    const a = Array.prototype.slice.call(r.buf, 0, n).sort((x, y) => x - y);
    let sum = 0; for (let i = 0; i < n; i++) sum += a[i];
    return { avg: sum / n, p50: a[(n * 0.5) | 0], p95: a[Math.min(n - 1, (n * 0.95) | 0)], max: a[n - 1], n };
  },
  stats() { return this.statsOf(this.frame); },
  all() {
    return { frame: this.statsOf(this.frame), work: this.statsOf(this.work),
             phys: this.statsOf(this.phys), draw: this.statsOf(this.draw) };
  },
  row(label, s) {
    if (!s) return label + '  --\n';
    return label + ' avg ' + s.avg.toFixed(2) + '  p50 ' + s.p50.toFixed(2) +
           '  p95 ' + s.p95.toFixed(2) + '  max ' + s.max.toFixed(2) + '\n';
  },
  paint(nowMs) {
    if (nowMs - this.lastPaint < 400) return;
    this.lastPaint = nowMs;
    const a = this.all(); if (!a.frame) return;
    const budget = a.work ? (a.work.p95 / 16.666 * 100) : 0;
    this.el.textContent =
      this.row('frame ms ', a.frame) +
      this.row('work  ms ', a.work) +
      this.row('  physics', a.phys) +
      this.row('  render ', a.draw) +
      'budget    ' + budget.toFixed(1) + '% of a 16.67 ms frame (p95 work)\n' +
      'fps       ' + (1000 / a.frame.avg).toFixed(1) + '   (n=' + a.frame.n + ')\n' +
      'steps/fr  ' + loopState.stepsThisFrame + '   STEP_MS ' + CONFIG.STEP_MS.toFixed(4) + '\n' +
      'bodies    ' + physics.dynamicBodies.length + ' dynamic, ' + physics.blocks.length + ' blocks\n' +
      'proj disp ' + physics.maxStepDisp.toFixed(2) + ' px/step  (radius ' + CONFIG.PROJECTILE.radius + ')\n' +
      'tunnels   ' + physics.tunnelEvents + '\n' +
      'shots     ' + turns.shots + '   forced turn ends ' + turns.forcedEnds + '\n' +
      'state     ' + state.curState + (state.inputLocked ? ' [locked]' : '');
  },
};

function stepWorld() {
  Engine.update(physics.engine, CONFIG.STEP_MS);
  physics.afterStep();
  turns.step();
}

function loop(now) {
  requestAnimationFrame(loop);

  if (!loopState.lastT) loopState.lastT = now;
  let frameMs = now - loopState.lastT;
  loopState.lastT = now;
  if (frameMs > 250) frameMs = 250;         // tab stall clamp

  /* PAUSED advances NOTHING. Not the accumulator, not a step, not the CPU's
     think timer, not TURN_MAX_STEPS. That is why every deadline in this file
     is counted in simulated steps rather than wall clock: a performance.now()
     deadline would expire behind the pause overlay, and the state table has
     no PAUSED -> TURN_RESULT edge for it to fire into. */
  const frozen = state.curState === STATES.PAUSED;
  if (frozen) loopState.acc = 0; else loopState.acc += frameMs;

  const tWork = PERF ? performance.now() : 0;

  let steps = 0;
  while (loopState.acc >= CONFIG.STEP_MS && steps < CONFIG.MAX_STEPS_PER_FRAME) {
    stepWorld();
    loopState.acc -= CONFIG.STEP_MS;
    steps++;
  }
  if (steps >= CONFIG.MAX_STEPS_PER_FRAME) loopState.acc = 0;   // drop the backlog
  loopState.stepsThisFrame = steps;
  const tPhys = PERF ? performance.now() : 0;

  // Arc recompute: once per frame, only when the drag actually changed.
  if (aim.active && aim.dirty) {
    aim.update();
    const ch = turns.activeChar();
    if (ch) aim.rebuildArc(ch);
    aim.dirty = false;
  }

  if (!frozen) turns.frame(steps);
  ui.syncOverlays();
  const tTurns = PERF ? performance.now() : 0;
  render.frame(now);

  if (PERF) {
    const end = performance.now();
    perf.push(frameMs);
    perf.put(perf.work, end - tWork);
    perf.put(perf.phys, tPhys - tWork);
    perf.put(perf.draw, end - tTurns);
    perf.paint(now);
  }
}

/* ============================================================ boot =======
   Failure path 2: fonts slow or missing. ctx.fillText with a webfont that
   has not arrived silently falls back and does NOT re-render when it does.
   Every block carries a label, so that is visible on the first frames of
   every session. Race document.fonts.ready against FONT_TIMEOUT_MS and draw
   whichever resolves first.
   ======================================================================== */
const FONT_PROBES = [
  { css: '40px', family: 'Lilita One' },
  { css: '500 20px', family: 'Fredoka' },
];

/* Neither document.fonts.load() nor document.fonts.check() can answer "is
   this webfont actually usable yet", and both fail in the SAME direction —
   they say yes when the answer is no:

     * The @font-face rules are registered by the Google Fonts <link>, which
       loads asynchronously. If load() runs first it matches no face,
       resolves instantly with an empty list, and fonts.ready resolves too
       because nothing is pending.
     * check() returns true vacuously when no @font-face matches the family,
       because the text is renderable with a system fallback.

   Both were measured doing exactly that: with the font domains blocked
   entirely, each cleared the splash in ~250 ms and the game drew every block
   label in a fallback that never re-renders.

   So measure instead. Render a probe string in the target family with a
   generic fallback, and in the generic alone. Different widths mean the
   webfont is really being used. Require a difference against 2 of 3 generics
   so one coincidental metric match cannot produce a false positive. */
let fontProbeCtx = null;
function fontIsReallyLoaded(probe) {
  if (!fontProbeCtx) {
    const c = document.createElement('canvas');
    c.width = c.height = 8;
    fontProbeCtx = c.getContext('2d');
  }
  const ctx = fontProbeCtx;
  const text = 'ABCDEFGHIJ0123456789';
  let differs = 0;
  for (const fb of ['monospace', 'serif', 'sans-serif']) {
    ctx.font = probe.css + ' ' + fb;
    const base = ctx.measureText(text).width;
    ctx.font = probe.css + ' "' + probe.family + '", ' + fb;
    if (Math.abs(ctx.measureText(text).width - base) > 0.5) differs++;
  }
  return differs >= 2;
}

function waitForFonts(timeoutMs) {
  return new Promise((resolve) => {
    const t0 = performance.now();
    let done = false;
    const finish = (how) => { if (!done) { done = true; resolve(how); } };
    setTimeout(() => finish('timeout'), timeoutMs);

    const poll = () => {
      if (done) return;
      try {
        if (FONT_PROBES.every(fontIsReallyLoaded)) return finish('loaded');
        // Keep kicking the fetch; a no-op until the stylesheet registers the face.
        if (document.fonts && document.fonts.load) {
          FONT_PROBES.forEach(p => {
            try { document.fonts.load(p.css + ' "' + p.family + '"').catch(() => {}); } catch (e) {}
          });
        }
      } catch (e) { return finish('error'); }
      if (performance.now() - t0 >= timeoutMs) return finish('timeout');
      setTimeout(poll, 50);
    };
    poll();
  });
}

async function boot() {
  view.init();
  physics.create();

  /* ?perf=1 alone is M1's single-slot stress rig: 40 blocks, which is the body
     count the performance budget is written against, cycling forever with no
     hearts and no elimination.

     ?perf=1&slots=hccc runs a REAL 4-player match with the same overlay, which
     is what the M2 budget needs measuring against — 36 blocks plus 4
     characters is a different body mix from one 40-block tower. */
  const stress = PERF && !QS.get('slots');
  const kinds = stress ? ['human'] : (parseSlots(QS.get('slots')) || parseSlots('hc'));
  players.reset(kinds);
  physics.build(kinds.length, stress
    ? { cols: 4, rows: 10, characterIds: ['nim'] }
    : { characterIds: players.list.map(p => p.characterId) });

  ui.attach();

  const how = await waitForFonts(CONFIG.FONT_TIMEOUT_MS);
  if (window.console && PERF) console.log('[boot] fonts:', how);
  $('splash').hidden = true;
  if (PERF) { perf.init(); perf.el.hidden = false; }

  /* ?selftest=1 does NOT start the match or the rAF loop. The cpu, world and
     players groups need to build worlds of their own (4 players, a flattened
     castle, an unreachable target), and a live loop mutating the same
     singletons underneath them makes the harness a coin flip. Reload without
     the flag to play. */
  if (SELFTEST) { runSelftest(); return; }

  turns.stressLoop = stress;
  if (stress) turns.beginTurn(0);
  else turns.startMatch();
  requestAnimationFrame(loop);
}

/* ======================================================== selftest =======
   No test/, no CI, no package.json — and the workspace forbids a build step
   and npm, so vitest and jest are structurally unavailable. This harness is
   the whole unit-test story: plain assertions over the pure functions,
   behind ?selftest=1, skipped entirely on a normal load, and runnable on the
   actual tablet.

   M1 SUBSET: the plan lists 26 assertions across aim/cpu/turns/physics/
   players/world/boot. `cpu`, `players` (hearts, awards, scoring) and the
   turn-guard-order assertions cover code that does not exist until M2/M3, so
   they are NOT stubbed here — a passing stub is worse than a missing test.
   What runs below is every assertion whose subject M1 actually ships.

   What this harness deliberately does NOT cover, so it never creates false
   confidence: pointer-to-world mapping under real letterboxing, service
   worker freshness, font readiness, iOS audio unlock, tunnelling under real
   collision, and whether the drawn arc VISUALLY matches the flight. Those
   are integration failures on a real device and belong to /qa.
   ======================================================================== */
function runSelftest() {
  const results = [];
  const T = (group, name, fn) => {
    try {
      const why = fn();
      results.push({ group, name, ok: true, why: why || '' });
    } catch (e) {
      results.push({ group, name, ok: false, why: (e && e.message) || String(e) });
    }
  };
  const ok = (cond, msg) => { if (!cond) throw new Error(msg || 'assertion failed'); };
  const near = (a, b, eps, msg) => {
    if (!(Math.abs(a - b) <= eps)) throw new Error((msg || 'not near') + ': ' + a + ' vs ' + b + ' (eps ' + eps + ')');
    return a.toFixed(4) + ' ~= ' + b.toFixed(4);
  };

  /* Build a real world to assert against, and hand back the opponent list in
     the shape `cpu` takes. ?selftest=1 does not start the match loop (see
     boot), so these worlds are the harness's alone and nothing is racing it. */
  const stWorld = (kinds) => {
    players.reset(kinds);
    physics.build(kinds.length, { characterIds: players.list.map(p => p.characterId) });
    return players.list.map(p => ({ id: p.id, castleId: p.castleId, alive: p.alive }));
  };

  /* ---- aim: power curve ---- */
  T('aim', 'powerCurve(0) === MIN_SPEED', () =>
    near(aim.powerCurve(0), CONFIG.MIN_SPEED, 1e-9));

  T('aim', 'powerCurve(MAX_DRAG) === MAX_SPEED', () =>
    near(aim.powerCurve(CONFIG.MAX_DRAG), CONFIG.MAX_SPEED, 1e-9));

  T('aim', 'power curve is monotonic across the range', () => {
    let prev = -Infinity;
    for (let d = 0; d <= CONFIG.MAX_DRAG; d += 2) {
      const s = aim.powerCurve(d);
      ok(s > prev, 'not increasing at drag=' + d);
      prev = s;
    }
    return 'strictly increasing over 0..' + CONFIG.MAX_DRAG;
  });

  T('aim', 'drag below MIN_DRAG cancels the shot', () => {
    ok(aim.shouldFire(CONFIG.MIN_DRAG) === true, 'exactly MIN_DRAG should fire');
    ok(aim.shouldFire(CONFIG.MIN_DRAG - 0.001) === false, 'just under MIN_DRAG must cancel');
    ok(aim.shouldFire(0) === false, 'a tap with no drag must cancel');
    return 'fires at >= ' + CONFIG.MIN_DRAG + ' px';
  });

  T('aim', 'drag clamps at MAX_DRAG', () => {
    const d = aim.computeDrag(0, 0, 0, 1000);        // 1000 px pull
    near(d.len, CONFIG.MAX_DRAG, 1e-9, 'length not clamped');
    near(Math.hypot(d.x, d.y), CONFIG.MAX_DRAG, 1e-9, 'vector not clamped');
    ok(d.y < 0, 'pull down must fire up: drag.y should be negative');
    return 'clamped to ' + CONFIG.MAX_DRAG + ', direction preserved';
  });

  /* ---- aim: trajectory preview ---- */
  T('aim', 'preview arc matches the engine integration after N steps', () => {
    const N = 120;
    const e = Engine.create({ enableSleeping: false });
    e.gravity.y = CONFIG.GRAVITY_Y; e.gravity.scale = CONFIG.GRAVITY_SCALE;
    const b = Bodies.circle(200, 300, CONFIG.PROJECTILE.radius, {
      density: CONFIG.PROJECTILE.density, frictionAir: CONFIG.PROJECTILE.frictionAir,
      collisionFilter: { mask: 0 },
    });
    Composite.add(e.world, b);
    Body.setVelocity(b, { x: 9, y: -11 });
    for (let i = 0; i < N; i++) Engine.update(e, CONFIG.STEP_MS);

    let px = 0, py = 0;
    aim.integrate(200, 300, 9, -11, N, (x, y) => { px = x; py = y; });
    // Sub-pixel over 120 steps. Anything bigger means the integrator drifted.
    near(px, b.position.x, 0.01, 'arc x');
    near(py, b.position.y, 0.01, 'arc y');
    return 'after ' + N + ' steps: dx=' + Math.abs(px - b.position.x).toExponential(2) +
           ' dy=' + Math.abs(py - b.position.y).toExponential(2);
  });

  T('aim', 'a 768 px shot completes inside ARC_MAX_STEPS', () => {
    // The longest shot the game can require: P1 -> P4 at 4 players.
    const centres = world.castleCentres(4);
    const range = centres[3] - centres[0];
    near(range, 768, 1e-9, '4-player span');
    const v = Math.sqrt(range * 0.2778);            // flat-ground 45 deg solution
    ok(v <= CONFIG.MAX_SPEED, 'required v ' + v.toFixed(2) + ' exceeds MAX_SPEED');
    const c = Math.SQRT1_2;
    let steps = 0, landed = -1;
    aim.integrate(centres[0], 700, v * c, -v * c, CONFIG.ARC_MAX_STEPS, (x, y, s) => {
      steps = s;
      if (y >= 700 && s > 2) { landed = s; return false; }
      return true;
    });
    ok(landed > 0, 'never came back down inside ' + CONFIG.ARC_MAX_STEPS + ' steps');
    ok(landed < CONFIG.ARC_MAX_STEPS, 'landed at the cap');
    return 'v=' + v.toFixed(2) + ' lands at step ' + landed + ' of ' + CONFIG.ARC_MAX_STEPS;
  });

  T('aim', 'arc truncates at the cull bounds, not at y = 0', () => {
    ok(aim.arcOut(0, -100) === false, 'y=-100 must NOT truncate the arc');
    ok(aim.arcOut(0, -299) === false, 'above the world is legal for the preview');
    ok(aim.arcOut(CONFIG.CULL.maxX + 1, 400) === true, 'right cull bound');
    ok(aim.arcOut(CONFIG.CULL.minX - 1, 400) === true, 'left cull bound');
    ok(aim.arcOut(400, CONFIG.CULL.maxY + 1) === true, 'bottom cull bound');
    // A near-vertical max-power lob must climb above the world and survive.
    let minY = Infinity;
    aim.integrate(512, 500, 1, -CONFIG.MAX_SPEED, CONFIG.ARC_MAX_STEPS, (x, y) => {
      if (y < minY) minY = y;
      return !aim.arcOut(x, y);
    });

  T('cpu', 'the silly shot fires about 12% of the time and lands on its own castle', () => {

    const N = 4000;
    let silly = 0;
    for (let i = 0; i < N; i++) if (cpu.decide(0, opp, rnd).reason === 'silly') silly++;
    const pct = silly / N * 100;
    const want = CONFIG.CPU.sillyShotChance * 100;

       'silly shot fired ' + pct.toFixed(1) + '% over ' + N + ' trials, expected ~' + want + '%');

    /* Angular error ALONE lands short or long on the correct side and
       essentially never behind the shooter, so this is the only mechanism
       that produces the self-demolition the product is partly about. It has
       to actually come down on its own castle. */
    const from = aim.launchPoint(physics.charOf(0));
    const cas = physics.castles[0];
    const rnd2 = mulberry32(99);
    /* "On or beside its own castle" = inside its own platform, plus a block
       of grace. Derived from CONFIG so retuning the band re-fails this. */
    const ownLimit = world.platformWidth(cas.cols) / 2 + CONFIG.BLOCK.w;
    let onOwn = 0, trials = 400, worstOff = 0;
    for (let i = 0; i < trials; i++) {
      const shot = cpu.sillyShot(1, rnd2);
      const elev = Math.atan2(-shot.vy, Math.abs(shot.vx)) * 180 / Math.PI;
      ok(elev >= CONFIG.CPU.sillyElevMinDeg - 0.001 && elev <= CONFIG.CPU.sillyElevMaxDeg + 0.001,

      const land = cpu.landingX(from.x, from.y, shot.speed,
                                Math.atan2(-shot.vy, Math.abs(shot.vx)), 1, cas.platformTopY, 900);
      ok(land !== null, 'a silly shot never came back down');
      const off = Math.abs(land - cas.centreX);
      if (off > worstOff) worstOff = off;
      if (off <= ownLimit) onOwn++;
    }
    ok(onOwn === trials,
       'only ' + onOwn + '/' + trials + ' silly shots landed on or beside their own castle ' +
       '(worst ' + worstOff.toFixed(0) + ' px vs limit ' + ownLimit.toFixed(0) + ')');
    /* And the harder property: a silly shot must never be able to reach a
       neighbour. At 4 players the nearest castle centre is one slice away. */
    const halfSlice = CONFIG.WORLD_W / 4 / 2;
    ok(worstOff < halfSlice,
       'a silly shot can carry ' + worstOff.toFixed(0) + ' px, past the 4-player half-slice of ' +
       halfSlice.toFixed(0) + ' — it could land on an opponent, which makes it a lucky shot');
    return pct.toFixed(1) + '% over ' + N + ' trials; worst carry ' + worstOff.toFixed(0) +
           ' px vs own-platform limit ' + ownLimit.toFixed(0) + ' and half-slice ' + halfSlice;
  });

  T('cpu', 'error injection stays inside its band and never leaves the speed range', () => {
    const base = { vx: 10, vy: -10, speed: Math.hypot(10, 10) };
    const baseAng = Math.atan2(base.vy, base.vx);
    let maxDev = 0, minSpd = Infinity, maxSpd = -Infinity;
    const rnd = mulberry32(4242);
    for (let i = 0; i < 3000; i++) {
      const e = cpu.applyError(base, rnd);
      const dev = Math.abs(normAngle(Math.atan2(e.vy, e.vx) - baseAng)) * 180 / Math.PI;
      if (dev > maxDev) maxDev = dev;
      if (e.speed < minSpd) minSpd = e.speed;
      if (e.speed > maxSpd) maxSpd = e.speed;
      near(Math.hypot(e.vx, e.vy), e.speed, 1e-9, 'velocity magnitude must equal speed');
    }
    ok(maxDev <= CONFIG.CPU.angleErrDeg + 1e-6,
       'angle deviated ' + maxDev.toFixed(2) + ' deg, band is +/-' + CONFIG.CPU.angleErrDeg);
    ok(maxDev > CONFIG.CPU.angleErrDeg * 0.9, 'the error band is barely being used — is rnd wired in?');
    ok(minSpd >= CONFIG.MIN_SPEED - 1e-9 && maxSpd <= CONFIG.MAX_SPEED + 1e-9, 'speed left its range');
    ok(maxSpd <= base.speed * (1 + CONFIG.CPU.powerJitter) + 1e-9, 'power jitter exceeded its band');
    // Difficulty is aim error, NEVER a damage multiplier.
    ok(CONFIG.CPU.damageMultiplier === undefined && CONFIG.CPU.damageScale === undefined,
       'a CPU damage multiplier has appeared — difficulty is aim error only');
    return 'angle within +/-' + maxDev.toFixed(1) + ' deg of ' + CONFIG.CPU.angleErrDeg +
           ', speed ' + minSpd.toFixed(2) + '-' + maxSpd.toFixed(2) + ', no damage multiplier';
  });

  T('cpu', 'the bot lines up with the same arc a human sees', () => {
    stWorld(['cpu', 'human']);
    const ch = physics.charOf(0);
    aim.setShot(8, -12, Math.hypot(8, 12));
    near(aim.velX, 8, 1e-9, 'velX');
    near(aim.velY, -12, 1e-9, 'velY');
    ok(aim.dragLen > 0 && aim.dragLen <= CONFIG.MAX_DRAG, 'drag length must be inside the gesture range');
    near(aim.powerCurve(aim.dragLen), aim.speed, 1e-6,
         'the drawn pull-back must map back to the speed the bot is about to use');
    aim.rebuildArc(ch);
    ok(aim.arcN > 1, 'the bot got no preview arc');
    return 'setShot -> dragFor -> powerCurve round-trips; arc has ' + aim.arcN + ' points';
  });

  /* ---- render: motion ---- */
  T('render', 'reduced motion disables SHAKE ONLY, not the game', () => {
    const savedRM = render.reduceMotion, savedMag = render.shakeMag, savedUntil = render.shakeUntil;
    try {
      render.reduceMotion = false;
      render.shakeMag = 0; render.shakeUntil = 0;
      render.shake(9);
      ok(render.shakeMag === 9, 'shake must work normally when reduced motion is off');

      render.reduceMotion = true;
      render.shakeMag = 0; render.shakeUntil = 0;
      render.shake(9);
      ok(render.shakeMag === 0, 'shake must be a no-op under prefers-reduced-motion');

      /* It must NOT reach anything that carries game information. The plan is
         explicit: trajectory dots, block motion and the exit wobble stay. */
      const ch = physics.charOf(0) || physics.characters[0];
      aim.setShot(6, -12, Math.hypot(6, 12));
      aim.rebuildArc(ch);
      ok(aim.arcN > 1, 'the trajectory preview must survive reduced motion');
      render.clearPuffs();
      render.puff(100, 200, '#fff', ch);
      ok(render.puffs.some(q => q.on), 'the elimination puff must survive reduced motion');
      render.clearPuffs();
    } finally {
      render.reduceMotion = savedRM; render.shakeMag = savedMag; render.shakeUntil = savedUntil;
    }
    return 'shake suppressed; arc, blocks and the exit wobble untouched';
  });

  T('render', 'an eliminated character leaves as the SAME silhouette', () => {
    stWorld(['human', 'cpu']);
    render.clearPuffs();
    const bot = physics.charOf(1);
    bot.facing = -1;
    render.puff(bot.body.position.x, bot.body.position.y, '#43e6a5', bot);
    const q = render.puffs.find(x => x.on);
    ok(q, 'no puff was recorded');
    ok(q.charId === bot.characterId,
       'the wobble drew a ' + q.charId + ' for a ' + bot.characterId +
       ' — an eliminated player must not leave as a different creature');
    ok(q.charId === 'bolt', 'a CPU slot is the robot silhouette');
    ok(q.facing === -1, 'facing must be carried over so the exit is not mirrored');
    ok(typeof render.drawSilhouette === 'function',
       'the live character and the wobble must share one silhouette function');
    /* The body is already gone by the time the wobble is drawn: the exit is
       cosmetic and cannot reach the settle predicate or the turn guards. */
    ok(bot.eliminated === false, 'setup: puff() itself must not eliminate anyone');
    physics.removeCharacter(bot);
    ok(physics.dynamicBodies.indexOf(bot.body) < 0,
       'an eliminated character must leave the physics world');
    ok(render.puffs.some(x => x.on), 'and its puff must outlive its body');
    render.clearPuffs();
    return 'robot leaves as a robot, facing preserved, body already out of the world';
  });

  /* ---- report ---- */
  const passed = results.filter(r => r.ok).length;
  const total = results.length;
  const list = $('st-list');
  for (const r of results) {
    const li = document.createElement('li');
    li.className = r.ok ? 'ok' : 'bad';
    li.innerHTML =
      '<span class="tag">' + (r.ok ? 'PASS' : 'FAIL') + '</span>' +
      '<span class="grp">' + r.group + '</span>' +
      '<span class="msg">' + r.name + '<span class="why">' + r.why + '</span></span>';
    list.appendChild(li);
  }
  const score = $('st-score');
  score.textContent = passed + ' / ' + total + (passed === total ? '  PASS' : '  FAIL');
  score.className = passed === total ? 'pass' : 'fail';
  $('selftest').hidden = false;

  const line = 'selftest ' + passed + '/' + total;
  if (passed === total) console.log('%c' + line + ' PASS', 'color:#43e6a5;font-weight:700');
  else console.error(line + ' FAIL', results.filter(r => !r.ok));

  window.__selftest = { passed, total, results };
  return { passed, total };
}

// Small surface for /qa and the perf gate. Not used by the game itself.
window.CastleBlasters = { CONFIG, STATES, state, turns, turnRules, physics, aim, cpu,
                          world, view, players, render, ui, perf, parseSlots };

boot();
})();
</script>

    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .catch(err => console.warn('Service worker registration failed:', err));
    });
  }
</script>
