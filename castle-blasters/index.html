<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Castle Blasters</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#ffd700">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blasters">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:  #1a2555;   /* letterbox bars — launcher background */
    --gold:  #ffd700;   /* this game's permanent DESIGN.md slot-2 colour */
    --ink:   #2a1a0a;
    --cream: #fff8e7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; width: 100%; overflow: hidden;
    background: var(--navy);
    font-family: 'Fredoka', sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  /* The canvas is full-bleed; the world is letterboxed *inside* it, so the
     letterbox bars absorb the notch and no safe-area padding is needed here.
     The DOM HUD (M3) is what will need env(safe-area-inset-*). */
  #game {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; background: var(--navy); touch-action: none;
  }

  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: var(--navy); padding: 24px;
  }
  .overlay[hidden] { display: none; }

  #splash { flex-direction: column; gap: 14px; }
  #splash .title {
    font-family: 'Lilita One', sans-serif; font-size: 44px;
    color: var(--gold); letter-spacing: 2px; text-align: center;
  }
  #splash .dots { display: flex; gap: 10px; }
  #splash .dots i {
    width: 14px; height: 14px; border-radius: 50%; background: var(--cream);
    animation: bob .9s ease-in-out infinite;
  }
  #splash .dots i:nth-child(2) { animation-delay: .15s; }
  #splash .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bob { 0%,100% { transform: translateY(0); opacity:.5 } 50% { transform: translateY(-10px); opacity:1 } }

  .card {
    background: var(--cream); border: 6px solid var(--ink); border-radius: 26px;
    box-shadow: 0 8px 0 var(--ink); padding: 28px 30px; max-width: 460px;
    text-align: center; color: var(--ink);
  }
  .card h1 { font-family: 'Lilita One', sans-serif; font-size: 30px; margin-bottom: 6px; }
  .card p  { font-size: 17px; font-weight: 500; margin-bottom: 20px; }
  .card button {
    font-family: 'Lilita One', sans-serif; font-size: 26px; letter-spacing: 1px;
    padding: 16px 34px; border-radius: 22px; border: 5px solid var(--ink);
    background: var(--gold); color: var(--ink); box-shadow: 0 6px 0 var(--ink);
    cursor: pointer;
  }
  .card button:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--ink); }

  /* ?selftest=1 */
  #selftest { align-items: flex-start; justify-content: flex-start; overflow: auto; background: #0d1330; }
  #selftest .wrap { width: 100%; max-width: 780px; margin: 0 auto; color: var(--cream); font-size: 14px; }
  #selftest h1 { font-family: 'Lilita One', sans-serif; font-size: 26px; margin-bottom: 4px; color: var(--gold); }
  #st-score { font-size: 20px; font-weight: 700; margin-bottom: 14px; }
  #st-score.pass { color: #43e6a5; }
  #st-score.fail { color: #ff3b6b; }
  #st-list { list-style: none; }
  #st-list li { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.1); display: flex; gap: 10px; }
  #st-list li .tag { flex: 0 0 46px; font-weight: 700; }
  #st-list li.ok  .tag { color: #43e6a5; }
  #st-list li.bad .tag { color: #ff3b6b; }
  #st-list li .grp { flex: 0 0 74px; opacity: .55; }
  #st-list li .msg { flex: 1 1 auto; }
  #st-list li .why { display: block; opacity: .7; font-size: 12px; }

  /* ---------------------------------------------------------------- M2 ---
     Three overlays and one button. This is NOT the DOM HUD — that is M3
     (player pill, heart pips, round pill, score pill). These are the minimum
     the M2 turn loop needs in order to be playable and testable:
       #pass   pass-the-device, shown only when the NEXT player is human
       #paused the only mid-match affordance; the M2 exit gate requires a
               pause mid-flight to prove the input lock survives it
       #final  the win condition made visible. Rankings and awards are M3.
     Absolute CSS px, not world units, so they stay readable when the world
     is letterboxed into portrait. */
  .sheet { flex-direction: column; gap: 16px; background: rgba(13,19,48,.94); }
  .sheet .who {
    font-family: 'Lilita One', sans-serif; font-size: 26px; letter-spacing: 2px;
    color: var(--cream); text-align: center;
  }
  .sheet .who2 {
    font-family: 'Lilita One', sans-serif; font-size: 34px; letter-spacing: 1px;
    color: var(--cream); text-align: center;
  }
  .sheet .badge {
    width: 132px; height: 132px; border-radius: 50%;
    border: 7px solid var(--ink); box-shadow: 0 7px 0 var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Lilita One', sans-serif; font-size: 68px; color: var(--ink);
  }
  .sheet .kind {
    font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 17px;
    letter-spacing: 2px; color: var(--gold);
  }
  button.big {
    font-family: 'Lilita One', sans-serif; font-size: 30px; letter-spacing: 1px;
    padding: 18px 40px; border-radius: 24px; border: 6px solid var(--ink);
    background: var(--gold); color: var(--ink); box-shadow: 0 7px 0 var(--ink);
    cursor: pointer; touch-action: manipulation;
  }
  button.big:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--ink); }
  /* Self-disable on first activation. A 4-year-old double-taps everything, so
     the button stops being a button before the second tap lands. */
  button.big[disabled] { opacity: .45; pointer-events: none; }

  #pause-btn {
    position: fixed; z-index: 9;
    top: calc(10px + env(safe-area-inset-top));
    right: calc(10px + env(safe-area-inset-right));
    width: 54px; height: 54px; border-radius: 16px;
    border: 4px solid var(--ink); background: var(--gold); color: var(--ink);
    box-shadow: 0 4px 0 var(--ink);
    font-size: 20px; line-height: 1; letter-spacing: 2px; cursor: pointer;
    touch-action: manipulation;
  }
  #pause-btn[hidden] { display: none; }
  #pause-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }

  /* ?perf=1 */
  #perf {
    position: fixed; top: 8px; left: 8px; z-index: 8;
    background: rgba(13,19,48,.86); color: #cfe6ff; border: 2px solid #43e6a5;
    border-radius: 10px; padding: 8px 10px; font: 12px/1.45 ui-monospace, Menlo, monospace;
    white-space: pre; pointer-events: none;
  }
  #perf[hidden] { display: none; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="overlay" id="splash">
  <div class="title">CASTLE BLASTERS</div>
  <div class="dots"><i></i><i></i><i></i></div>
</div>

<div class="overlay" id="retry" hidden>
  <div class="card">
    <h1>Let's try that again</h1>
    <p>The game needs the internet just this once. Tap the big button.</p>
    <button id="retry-btn" type="button">TRY AGAIN</button>
  </div>
</div>

<div class="overlay" id="selftest" hidden>
  <div class="wrap">
    <h1>Castle Blasters — selftest</h1>
    <div id="st-score">running…</div>
    <ol id="st-list"></ol>
  </div>
</div>

<!-- M2: pass-the-device. Shown ONLY when the next living player is human,
     so a solo game against the CPU never sees it. -->
<div class="overlay sheet" id="pass" hidden>
  <div class="who">PASS THE TABLET TO</div>
  <div class="badge" id="pass-badge"><span id="pass-num">1</span></div>
  <div class="who2" id="pass-name">PLAYER 1</div>
  <div class="kind" id="pass-kind">YOUR TURN</div>
  <button class="big" id="pass-btn" type="button">I'M READY</button>
</div>

<!-- M2: the only mid-match affordance. SETTINGS and HOME land at M3 with the
     rest of the shell; RESUME is what the M2 exit gate needs. -->
<div class="overlay sheet" id="paused" hidden>
  <div class="who">PAUSED</div>
  <button class="big" id="resume-btn" type="button">RESUME</button>
</div>

<!-- M2: the win condition made visible. Rankings, scores and awards are M3. -->
<div class="overlay sheet" id="final" hidden>
  <div class="who" id="final-title">WINNER</div>
  <div class="badge" id="final-badge"><span id="final-num">1</span></div>
  <div class="who2" id="final-name">PLAYER 1</div>
  <button class="big" id="again-btn" type="button">PLAY AGAIN</button>
</div>

<button id="pause-btn" type="button" hidden aria-label="Pause">&#10074;&#10074;</button>

<div id="perf" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script>
/* ==========================================================================
   CASTLE BLASTERS — M2 (Turns)

   Everything lives in this one file: no build step, no npm, no framework
   (workspace CLAUDE.md). Matter.js arrives from the same jsdelivr URL the
   other two apps already cache.

   MODULE LAYERING — a hard rule, because nothing in a single-file IIFE
   enforces it. Modules may only call DOWNWARD in this order:

       CONFIG -> view -> state -> world / players / turns
              -> physics -> cpu -> audio -> render -> ui

   Four consequences, stated so they are not quietly broken later:
     * Only `turns` calls setState(). Every other module returns a value or
       raises an intent. This is what stops a turn ending twice.
     * `turns` is also the only module that mutates a player slot. `players`
       reports that a slot died; `turns` is what tells `physics` to remove
       the character and `render` to puff.
     * `render` and `ui` never mutate game state, and `render` never
       allocates per frame.
     * `physics` never calls `ui` or `audio` directly. It records what
       happened into a queue; `turns` drains it and decides what it means.

   THE RULES MODULES. `turnRules` and `playerRules` hold the definitions of
   turn end, the guard order, and the health model. The game calls them and
   ?selftest=1 asserts them — the SAME functions, never a parallel copy. An
   earlier draft reimplemented the turn-end predicates inline beside a
   `turnRules` only the harness ran, so breaking the shipped path would have
   left the harness green. Do not reintroduce that shape.

   M1 SCOPE (feel): canvas + fixed letterboxed world, ground from a
   descriptor, one castle, the slingshot gesture, the live dotted arc,
   projectile flight, damage, block destruction, WebAudio.

   M2 SCOPE (turns): slot population and the HUMAN/CPU flag, the turn and
   round managers, the CPU solver with error injection and the silly shot,
   pass-the-device, hearts, the fall check, elimination, the win condition,
   stone blocks and stepped platforms.

   NOT M2: the setup screen, the DOM HUD, the scoring display, round intro
   and final-results SCREENS, awards, the parent settings panel,
   localStorage, bonus targets, TTS, confetti, the launcher tile, the
   poster. Those are M3-M5, each with its own exit gate.

   Copied from crane-stacker/index.html: the Matter bootstrap, the canvas
   loop at devicePixelRatio, off-screen culling, the localStorage try/catch
   shape. NOT copied: the variable `dt` at crane-stacker/index.html:790,795.
   That game passes a variable delta to Engine.update. This one must not —
   see FIXED TIMESTEP below.
   ========================================================================== */
(() => {
'use strict';

/* ---------------------------------------------------------------- boot ---
   Failure path 1: Matter.js missing (captive portal, blocked CDN, hotel
   wifi). Without this the kid gets a blank navy rectangle and hands the
   tablet back. bootCheck is pure so ?selftest=1 can assert the path.
   ------------------------------------------------------------------------ */
function bootCheck(g) { return (g && g.Matter) ? 'ok' : 'retry'; }

const QS       = new URLSearchParams(location.search);
const SELFTEST = QS.get('selftest') === '1';
const PERF     = QS.get('perf') === '1';

const $ = (id) => document.getElementById(id);

if (bootCheck(window) === 'retry') {
  $('splash').hidden = true;
  $('retry').hidden = false;
  $('retry-btn').addEventListener('click', () => location.reload());
  return;
}

const { Engine, Bodies, Body, Composite, Events } = Matter;

/* Matter normalises velocities against this. Body.setVelocity takes px per
   BASE_DELTA ms regardless of the actual step size, which is what makes
   every speed below step-independent. */
const BASE_DELTA = 1000 / 60;

/* =========================================================== CONFIG ======
   Every tunable lives here. Nothing tunable lives inline.
   (Entries M1 does not use yet — HEARTS, CPU, BONUS_CHANCE — are carried
   verbatim from the approved plan so M2+ does not have to reopen this
   block.)
   ======================================================================== */
const CONFIG = {
  // world + timestep
  WORLD_W: 1024, WORLD_H: 768,
  STEP_MS: 16.666 / 3,            // 5.5555 — one rate, always
  MAX_STEPS_PER_FRAME: 8,

  // physics
  GRAVITY_Y: 1, GRAVITY_SCALE: 0.001,   // Matter defaults, stated because all ballistics depend on them
  BLOCK: { w: 40, h: 40, chamfer: 4, density: 0.004,
           friction: 0.95, frictionStatic: 1.2, restitution: 0.05 },
  PROJECTILE: { radius: 18, density: 0.008, friction: 0.4,
                restitution: 0.2, frictionAir: 0 },
  CHARACTER: { w: 36, h: 44, chamfer: 8, density: 0.003,
               friction: 0.9, frictionStatic: 1.0, restitution: 0.05 },
  MAT_HITS: { wood: 1, stone: 2 },
  IMPACT_HIT: 60,

  // aiming
  MIN_DRAG: 28, MAX_DRAG: 220,
  MIN_SPEED: 5, MAX_SPEED: 18, POWER_EXP: 1.35,
  SPAWN_OFFSET_Y: 30, SPAWN_GRACE_STEPS: 3,
  ARC_MAX_STEPS: 420, ARC_DOT_EVERY: 8,

  // turn lifecycle
  PROJECTILE_REST_V: 0.5, PROJECTILE_REST_STEPS: 10,
  /* PROJECTILE_MAX_STEPS must never be below ARC_MAX_STEPS: the projectile
     has to live at least as long as the arc that promised it, or the preview
     draws a landing the ball never reaches.

     M1 CORRECTION to the approved plan, which specified 300 here. That number
     contradicts the plan's own derivation of ARC_MAX_STEPS = 420 ("a
     near-vertical lob at MAX_SPEED takes about 389 steps") and it breaks the
     Success Criterion "the drawn trajectory arc matches the actual flight
     path along its whole length". Measured: a MAX_SPEED near-vertical lob
     flies 400 steps, and at 300 it was deleted at y = 62, still 240 px above
     the castle it was drawn landing on. That is the first shot a 4-year-old
     fires — pull down, shoot straight up.
     Derived, not picked. The longest flight the gesture can produce is
     MAX_SPEED fired straight up from the HIGHEST possible launch point — the
     top of a 4-row castle standing on the highest platform M2 may introduce
     (PLATFORM_DY_MAX) — then a fall all the way to the bottom cull bound:

       launch y = 700 - 80 - 4*40 - 44 - 30 = 386
       rise     = 195 steps to an apex of y = -197
       fall     = 275 steps from -197 down to the cull bound at y = 968
       total    ~ 470 steps

     600 gives ~28% headroom and is 3.33 s of simulated time, still far inside
     TURN_MAX_STEPS (2160). This restores the cap to what the plan intended —
     a backstop against a ball that never settles — instead of something that
     fires on an ordinary shot. ?selftest=1 recomputes the worst case from
     CONFIG and fails if this stops covering it. */
  PROJECTILE_MAX_STEPS: 600,
  SETTLE_V: 1.2, SETTLE_W: 0.08, SETTLE_STEPS: 20, QUIET_AFTER_IMPACT_STEPS: 30,
  TURN_MAX_STEPS: 2160,           // 12s of simulated time
  TURN_RESULT_STEPS: 90,          // M1 addition: 0.5s beat on TURN_RESULT before the next turn

  // match
  HEARTS: { 2: 3, 3: 2, 4: 2 },   // scales with player count
  ROUND_MAX: 12,
  PLATFORM_DY_MAX: 80,            // bounds the MAX_SPEED derivation

  /* M2 CHOICE — the stepped platform height the plan left as Open Question 1.
     Castle i sits on a platform (i % 2) * PLATFORM_DY above the base ground,
     so the skyline alternates and a far castle is never fully occluded.

     60, not the 80 the derivation is bounded at. MAX_SPEED = 18 is only
     justified while the largest platform delta stays <= PLATFORM_DY_MAX, and
     the whole point of leaving headroom is not spending all of it. Re-derived
     against 60 (?selftest=1 recomputes this from CONFIG, so raising it
     re-fails rather than silently invalidating MAX_SPEED):

       longest shot   = castleCentres(4)[3] - [0]        = 768 px
       worst uphill   = max platform delta                =  60 px
       g              = GRAVITY_Y * GRAVITY_SCALE * 16.666^2 = 0.27776
       v_min^2        = g * (h + sqrt(h^2 + R^2))        = 230.6
       v_min          = 15.19   vs MAX_SPEED 18          = 18.5% headroom

     (At the bounding 80 the plan gets 15.4 and ~17%. Both hold; 60 holds by
     more, and it still reads as a visibly stepped skyline.) */
  PLATFORM_DY: 60,
  PLATFORM_PAD: 30,               // platform overhangs the castle footprint each side
  PLATFORM_SKIRT: 12,             // and sinks this far into the base ground, so no seam

  /* Bottom N rows are stone (2 hits), everything above is wood (1 hit). The
     plan ships both materials and never says where stone goes. A stone
     foundation is the reading a 4-year-old can state out loud, it is
     identical for every player so nothing is unfair, and it lands exactly
     where the CPU aims (the lowest standing block) so the bot's best shot
     goes clang-then-smash instead of smash. Materials differ in hit points
     ONLY — same density, same friction. Ice was cut for having a physics
     property; stone must not quietly reintroduce one. */
  STONE_ROWS: 1,

  /* A character fell if, at turn end, its centre is more than FALL_DY below
     where it stood when the turn began, or outside its own castle footprint.

     M2 CORRECTION to the plan, which says "more than 120 px below its own
     PLATFORM's top surface". That cannot fire: the character stands on TOP of
     its castle, so on a 3-row castle its home is already 142 px ABOVE the
     platform top and it would have to end up underground to qualify. The rule
     exists to catch precisely the case the plan names — "knocking an enemy
     character off its collapsing castle onto the ground" — so the reference
     has to be where it was standing, not the platform under the castle.

     80 is derived from the castles the game actually builds, and ?selftest=1
     asserts both ends of the bracket:
       must fire:     a full topple off the SHORTEST castle = 3 rows = 120 px
       must NOT fire: losing one row of cover                =         40 px
     So FALL_DY must sit strictly inside (40, 120). 80 is two block rows. */
  FALL_DY: 80,
  FALL_SLICE_PAD: 40,             // horizontal grace outside the castle footprint

  /* "Standing", for CPU targeting and (at M4) bonus targets. All three of:
     present in the world, centre inside its own castle footprint, and upright
     AND elevated. Without the last clause a block lying flat on the ground
     inside its own slice counts as cover, which skews "fewest standing
     blocks" toward castles that are already flattened. */
  STANDING_MAX_ANGLE_DEG: 30,
  STANDING_SLOP: 2,               // Matter lets a resting body sink a hair

  // scoring (tracked at M2; the floating labels and the HUD are M3)
  SCORE: { blockHit: 10, woodKill: 25, stoneKill: 50,
           charHit: 100, bonus: 150, knockout: 200 },

  // cpu (v1 ships easy only)
  CPU: { angleErrDeg: 12, powerJitter: 0.08,
         sillyShotChance: 0.12, thinkMs: 700,
         /* Presentation: think, then line up with the same dotted arc a human
            sees, then fire. The kid gets to watch the bot aim and miss. Both
            are counted in SIMULATED steps, not wall clock, for the same
            reason TURN_MAX_STEPS is — steps do not advance while PAUSED. */
         aimMs: 600,
         /* Solve at just over the minimum speed that reaches the target: the
            lobbiest shot that works, which is also the one most likely to
            clear an intervening castle. 1.06 keeps the discriminant safely
            positive (it is exactly zero at the minimum). */
         solveMargin: 1.06,
         /* An obstruction only counts if the arc dies well short of the aim
            point — otherwise every good shot reads as blocked, because it
            terminates on the block it was aimed at. */
         blockTolPx: 60,
         /* Silly shot: a deliberate near-vertical launch that lands on or
            near the bot's own castle. Angular error alone lands short or long
            on the correct SIDE and essentially never behind the shooter, so
            this is the only mechanism that produces self-demolition. */
         /* The plan says 75-88 deg at low-to-mid power. 75 does not survive
            contact with the geometry: the launch point sits ~200 px ABOVE the
            platform (the character stands on top of the castle), so the extra
            fall buys the shot enough hang time to carry 229 px sideways —
            past its own castle, out of its own slice, and at 4 players into
            the neighbour's. A silly shot that can land on an opponent is not
            a silly shot, it is a lucky one, and the joke stops working.
            Re-derived so the worst case in the band stays inside its own
            platform: 82-88 deg at 6-9 gives 14-105 px, against a platform
            half-width of 90 and a 4-player half-slice of 128. ?selftest=1
            recomputes both bounds from CONFIG. */
         sillyElevMinDeg: 82, sillyElevMaxDeg: 88,
         sillySpeedMin: 6, sillySpeedMax: 9 },

  // learning (M4)
  BONUS_CHANCE: 0.5,
  LABEL_MIX: { 9: { letters: 5, numbers: 4 }, 12: { letters: 7, numbers: 5 } },

  // ui
  BUTTON_DEBOUNCE_MS: 400, FONT_TIMEOUT_MS: 2000,
  ROUND_INTRO_STEPS: 108,         // 0.6 s beat on ROUND_INTRO
  ELIM_PUFF_MS: 700,              // the puff an eliminated character leaves with
  ELIM_WOBBLE_MS: 420,            // and the wobble on the way out, never an injury

  // cull bounds (bodies). The arc uses the same box MINUS the top edge —
  // a near-vertical shot legitimately climbs to about y = -43 and comes back,
  // and truncating the preview at y = 0 would draw a lie.
  CULL: { minX: -200, maxX: 1024 + 200, maxY: 768 + 200, minY: -300 },

  // M1 affordance: how long the player may sit idle in PLAYER_TURN before
  // the canvas draws a pull-back hint. Not a HUD — an in-world nudge, so the
  // 4-year-old can find the gesture without being told.
  HINT_IDLE_MS: 4000,

  // palette
  COLOR: {
    letterbox: '#1a2555',           // launcher navy — the bars, never the world
    sky0: '#8fd8ff', sky1: '#d9f2ff',
    dirt: '#6b3f1f', grass: '#4caf50',
    wood: '#d9a05b', stone: '#b8b8b8',
    ink: '#2a1a0a', cream: '#fff8e7', gold: '#ffd700',
    ball: '#4a4a52',
    players: ['#2eb8ff', '#43e6a5', '#a86bff', '#f97316'],
  },
};

/* ============================================================ view =======
   ONE fixed world, no camera, no scrolling. The renderer computes a single
   uniform scale, centres the world and letterboxes the remainder.

   Pointer input MUST be inverse-transformed through the same scale and
   offset. There is exactly one toWorld() and every pointer handler goes
   through it. Raw client coordinates look correct on a 4:3 tablet in
   landscape (the bars are zero px wide there) and are completely broken in
   portrait, which is a tested case.
   ======================================================================== */
const view = {
  canvas: $('game'),
  ctx: null,
  dpr: 1, scale: 1, offX: 0, offY: 0, cssW: 0, cssH: 0,

  init() {
    this.ctx = this.canvas.getContext('2d', { alpha: false });
    this.resize();
  },

  resize() {
    const w = this.canvas.clientWidth || window.innerWidth;
    const h = this.canvas.clientHeight || window.innerHeight;
    this.cssW = w; this.cssH = h;
    this.dpr = Math.min(window.devicePixelRatio || 1, 3);
    this.canvas.width  = Math.max(1, Math.round(w * this.dpr));
    this.canvas.height = Math.max(1, Math.round(h * this.dpr));
    this.scale = Math.min(w / CONFIG.WORLD_W, h / CONFIG.WORLD_H);
    this.offX = (w - CONFIG.WORLD_W * this.scale) / 2;
    this.offY = (h - CONFIG.WORLD_H * this.scale) / 2;
    render.invalidate();
  },

  /* The single inverse transform. Nothing else may convert pointer coords. */
  toWorld(clientX, clientY) {
    const r = this.canvas.getBoundingClientRect();
    return {
      x: (clientX - r.left - this.offX) / this.scale,
      y: (clientY - r.top  - this.offY) / this.scale,
    };
  },

  /* Pure, so the selftest can exercise it without a real canvas. */
  static_toWorld(clientX, clientY, rectLeft, rectTop, offX, offY, scale) {
    return { x: (clientX - rectLeft - offX) / scale, y: (clientY - rectTop - offY) / scale };
  },
};

/* =========================================================== state =======
   Exactly one curState. Every transition goes through turns.setState().
   M1 runs the PLAYER_TURN <-> TURN_RESULT half of the machine, on one slot.
   Without that loop the input lock never clears and the player gets exactly
   one shot ever.
   ======================================================================== */
const STATES = {
  HOME: 'HOME', PLAYER_SETUP: 'PLAYER_SETUP', ROUND_INTRO: 'ROUND_INTRO',
  PLAYER_TURN: 'PLAYER_TURN', TURN_RESULT: 'TURN_RESULT', PASS_DEVICE: 'PASS_DEVICE',
  ROUND_COMPLETE: 'ROUND_COMPLETE', FINAL_RESULTS: 'FINAL_RESULTS', PAUSED: 'PAUSED',
};

const state = {
  curState: null,
  /* One flag, owned by the state machine. Every pointer handler returns
     early when it is set. There is no second in-flight guard. */
  inputLocked: true,
};

/* ========================================================= players =======
   The slot array. Creation, elimination, scoring. `players` sits ABOVE
   `physics` in the layering, so nothing here touches a body: loseHeart()
   reports that a slot died and `turns` is what tells physics to remove the
   character and render to puff.

   HEARTS ARE THE ONLY HEALTH MODEL, and only the character carries them. The
   castle is cover and points; destroying it never directly costs a heart.
   One rule a 4-year-old can state out loud: you lose when your guy falls.
   ======================================================================== */
const players = {
  list: [],

  /* kinds is an array of 'human' | 'cpu', one per slot — P3: every slot is
     one or the other and the turn manager treats them identically. The
     silhouette follows the kind, because that is the only distinction that
     carries information to a non-reader. */
  reset(kinds) {
    const n = kinds.length;
    this.list.length = 0;
    for (let i = 0; i < n; i++) {
      this.list.push({
        id: i + 1, name: 'PLAYER ' + (i + 1), kind: kinds[i],
        characterId: kinds[i] === 'cpu' ? 'bolt' : 'nim',
        color: CONFIG.COLOR.players[i % CONFIG.COLOR.players.length], castleId: i,
        hearts: (CONFIG.HEARTS[n] || 3), alive: true, score: 0,
        stats: { bestShotDamage: 0, selfHits: 0 },
      });
    }
    return this.list;
  },

  /* Play Again: reset scores, hearts and stats; KEEP the slots. */
  resetMatch() {
    const n = this.list.length;
    for (const p of this.list) {
      p.hearts = (CONFIG.HEARTS[n] || 3);
      p.alive = true;
      p.score = 0;
      p.stats.bestShotDamage = 0;
      p.stats.selfHits = 0;
    }
    return this.list;
  },

  byId(id) {
    for (let i = 0; i < this.list.length; i++) if (this.list[i].id === id) return this.list[i];
    return null;
  },

  living() { return this.list.filter(p => p.alive); },
  livingHumans() { return this.list.filter(p => p.alive && p.kind === 'human'); },

  /* Returns true if this took the slot's last heart. hearts === 0 is
     elimination; culled off-screen is elimination regardless of hearts and
     goes through eliminate() directly. */
  loseHeart(p) {
    if (!p.alive) return false;
    p.hearts -= 1;
    if (p.hearts <= 0) { p.hearts = 0; p.alive = false; return true; }
    return false;
  },

  eliminate(p) {
    if (!p.alive) return false;
    p.hearts = 0;
    p.alive = false;
    return true;
  },

  addScore(p, points) {
    p.score += points;
    return p.score;
  },

  /* Last player standing; points are the tiebreak, ties to the lower id.
     The tiebreak is what ROUND_MAX resolves on, and it is also the answer in
     the empty-room case (no living human left). */
  winner() {
    const alive = this.living();
    const pool = alive.length ? alive : this.list;
    let best = null;
    for (const p of pool) {
      if (!best) { best = p; continue; }
      if (p.score > best.score) best = p;
      else if (p.score === best.score && p.id < best.id) best = p;
    }
    return best;
  },
};

/* Slot configuration. The setup screen is M3; until it exists the slots come
   off the query string — ?slots=hc is one human and one CPU (the default and
   the Tuesday-afternoon case), ?slots=hh is two humans, ?slots=hccc is the
   4-player P5 falsification run. Pure, so ?selftest=1 asserts the same rule
   the M3 setup screen will enforce: 2-4 slots, at least one HUMAN. */
function parseSlots(raw) {
  const s = String(raw == null ? '' : raw).toLowerCase().replace(/[^hc]/g, '');
  if (s.length < 2 || s.length > 4) return null;
  if (s.indexOf('h') < 0) return null;               // never zero humans
  return s.split('').map(c => (c === 'h' ? 'human' : 'cpu'));
}

/* =========================================================== world =======
   Ground and castles are plain descriptors. That is what lets M1's power
   curve survive stepped platforms at M2, and makes a future builder phase
   additive rather than a rewrite.

   Coordinate convention: +y is DOWN, everywhere, matching Matter.
   ======================================================================== */
const world = {
  GROUND_TOP: 700,

  /* Ground: x, y are the LEFT and TOP edges. Index 0 is ALWAYS the base
     ground that spans the world; anything after it is a stepped platform.
     Rebuilt by buildGroundPlan() on every physics.build(). */
  groundPlan: [{ x: 0, y: 700, w: 1024, h: 68 }],

  /* Castle i is raised by this much. Alternating, so the skyline steps and a
     far castle is never fully occluded. The largest delta between any two
     platforms is therefore exactly PLATFORM_DY, which is the number the
     MAX_SPEED derivation is bounded by. */
  platformDy(i) { return (i % 2) * CONFIG.PLATFORM_DY; },
  platformTopY(i) { return this.GROUND_TOP - this.platformDy(i); },

  /* The largest height difference any shot can be asked to climb. */
  maxPlatformDelta(n) {
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i < n; i++) {
      const d = this.platformDy(i);
      if (d < lo) lo = d;
      if (d > hi) hi = d;
    }
    return n > 0 ? hi - lo : 0;
  },

  /* The longest shot the game can require at n players: outermost centre to
     outermost centre. n = 4 gives 768 px, which is what MAX_SPEED is derived
     from. */
  maxSpan(n) {
    if (n < 2) return 0;
    const c = this.castleCentres(n);
    return c[n - 1] - c[0];
  },

  platformWidth(cols) { return cols * CONFIG.BLOCK.w + 2 * CONFIG.PLATFORM_PAD; },

  buildGroundPlan(n, cols) {
    const out = [{ x: 0, y: this.GROUND_TOP, w: CONFIG.WORLD_W, h: 68 }];
    const centres = this.castleCentres(n);
    const pw = this.platformWidth(cols);
    for (let i = 0; i < n; i++) {
      const dy = this.platformDy(i);
      if (dy <= 0) continue;                        // sits on the base ground
      out.push({ x: centres[i] - pw / 2, y: this.GROUND_TOP - dy,
                 w: pw, h: dy + CONFIG.PLATFORM_SKIRT, platform: true });
    }
    this.groundPlan = out;
    return out;
  },

  /* The minimum launch speed that reaches a target R px away and h px higher
     (h < 0 for downhill), in Body.setVelocity units. Derived rather than
     tabulated, so re-verifying MAX_SPEED against a new PLATFORM_DY is one
     call and not a page of arithmetic:

       R = (v^2/g) * sqrt(1 - 2gh/v^2)   =>   u^2 - 2ghu - g^2 R^2 = 0
       u = v^2 = g * (h + sqrt(h^2 + R^2))                                  */
  gravityPerTick() { return CONFIG.GRAVITY_Y * CONFIG.GRAVITY_SCALE * BASE_DELTA * BASE_DELTA; },
  minSpeedFor(R, h) {
    const g = this.gravityPerTick();
    return Math.sqrt(g * (h + Math.hypot(h, R)));
  },

  /* Castle centres are a FORMULA, not a table. Adding a fifth slot is then a
     config change instead of arithmetic someone has to redo. */
  castleCentres(n) {
    const out = [];
    for (let i = 0; i < n; i++) out.push(CONFIG.WORLD_W * (i + 0.5) / n);
    return out;
  },

  /* The active player's activation region: their whole vertical slice. Not a
     radius around the character — a 4-year-old will not hit a small hotspot. */
  slice(n, i) {
    const w = CONFIG.WORLD_W / n;
    return { x0: w * i, x1: w * (i + 1) };
  },

  /* Fixed letter/number mix, positions shuffled per match. Not cosmetic: it
     guarantees both `letters` and `numbers` mode always find an eligible
     block on every castle, which random labelling does not. */
  mixFor(count) {
    const m = CONFIG.LABEL_MIX[count];
    if (m) return m;
    // Fallback for the ?perf=1 stress castle only; repeats are allowed there.
    const letters = Math.round(count * 5 / 9);
    return { letters, numbers: count - letters, repeats: true };
  },

  makeLabels(count, rnd) {
    rnd = rnd || Math.random;
    const mix = this.mixFor(count);
    const L = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const D = '0123456789'.split('');
    const take = (pool, k) => {
      const src = shuffle(pool.slice(), rnd);
      if (!mix.repeats) return src.slice(0, k);
      const out = [];
      for (let i = 0; i < k; i++) out.push(src[i % src.length]);
      return out;
    };
    return shuffle(take(L, mix.letters).concat(take(D, mix.numbers)), rnd);
  },

  /* Block descriptors. gx = column (0 = leftmost), gy = row (0 = bottom).
       worldX = castleBaseX + (gx + 0.5) * BLOCK_W
       worldY = platformTopY - (gy + 0.5) * BLOCK_H                          */
  makeCastlePlan(cols, rows, rnd) {
    const count = cols * rows;
    const labels = this.makeLabels(count, rnd);
    const out = [];
    let k = 0;
    for (let gy = 0; gy < rows; gy++) {
      for (let gx = 0; gx < cols; gx++) {
        out.push({ gx, gy, mat: this.matFor(gy), label: labels[k++] });
      }
    }
    return out;
  },

  /* Stone foundation, wood above. Identical for every castle, so no slot is
     handed a tougher tower than another. */
  matFor(gy) { return gy < CONFIG.STONE_ROWS ? 'stone' : 'wood'; },

  blockWorldX(baseLeftX, gx) { return baseLeftX + (gx + 0.5) * CONFIG.BLOCK.w; },
  blockWorldY(platformTopY, gy) { return platformTopY - (gy + 0.5) * CONFIG.BLOCK.h; },
};

function shuffle(a, rnd) {
  rnd = rnd || Math.random;
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ========================================================= physics =======
   Records what happened into `queue`. `turns` drains it and decides what it
   means. physics never calls audio or ui.
   ======================================================================== */
const physics = {
  engine: null, mworld: null,
  dynamicBodies: [],      // live array, maintained on add/remove — NOT rebuilt
                          // per call. Composite.allBodies().filter() at 180 Hz
                          // is ~360 throwaway arrays a second on a tablet.
  blocks: [],             // { body, hp, maxHp, mat, label, castleId, gx, gy }
  characters: [],         // { body, playerId, castleId, facing }
  castles: [],            // { id, centreX, baseLeftX, platformTopY, cols, rows }
  ground: [],
  projectile: null,       // Matter body or null
  projRest: 0, projAge: 0,
  stepCount: 0,
  lastImpactStep: -1e9,
  queue: [],              // drained by turns each frame
  indexDirty: true,

  // ?perf=1 tunnelling detector
  crossedIds: null, hitIds: null, tunnelEvents: 0, maxStepDisp: 0,

  create() {
    this.engine = Engine.create({ enableSleeping: false });
    /* Sleeping stays OFF. enableSleeping: true would be a bug here, not an
       optimisation: Sleeping.afterCollisions skips any pair containing a
       static body, and removing a supporting block generates no collision
       event at all — so the block above is never woken and hangs in mid-air,
       which destroys the one thing this product is for. */
    this.engine.gravity.y = CONFIG.GRAVITY_Y;
    this.engine.gravity.scale = CONFIG.GRAVITY_SCALE;
    this.mworld = this.engine.world;

    Events.on(this.engine, 'collisionStart', (ev) => this.onCollisionStart(ev));
  },

  addDynamic(body) {
    Composite.add(this.mworld, body);
    this.dynamicBodies.push(body);
    this.indexDirty = true;
  },

  removeDynamic(body) {
    Composite.remove(this.mworld, body);
    const i = this.dynamicBodies.indexOf(body);
    if (i >= 0) this.dynamicBodies.splice(i, 1);
    this.indexDirty = true;
  },

  /* --- build ---------------------------------------------------------- */
  /* Rows follow the plan's block budget: 12 blocks in 4 rows at 2 players
     (the generous castle), 9 in 3 rows at 3 and 4, where the slice is
     narrower and a taller tower would occlude its neighbours. Nine in three
     rows is the floor at which destruction reads as destruction — a 5-block
     pile does not come apart, it tips. */
  rowsFor(playerCount) { return playerCount <= 2 ? 4 : 3; },

  build(playerCount, opts) {
    opts = opts || {};
    const cols = opts.cols || 3;
    const rows = opts.rows || this.rowsFor(playerCount);

    // wipe
    Composite.clear(this.mworld, false, true);
    this.dynamicBodies.length = 0;
    this.blocks.length = 0;
    this.characters.length = 0;
    this.castles.length = 0;
    this.ground.length = 0;
    this.projectile = null;
    this.queue.length = 0;
    this.indexDirty = true;

    /* Ground from the descriptor (Bodies.rectangle takes a CENTRE). Index 0
       is the base ground; the rest are the stepped platforms. */
    for (const g of world.buildGroundPlan(playerCount, cols)) {
      const b = Bodies.rectangle(g.x + g.w / 2, g.y + g.h / 2, g.w, g.h, {
        isStatic: true, label: 'ground', friction: 0.9,
      });
      b.plan = g;
      Composite.add(this.mworld, b);
      this.ground.push(b);
    }

    const centres = world.castleCentres(playerCount);
    for (let ci = 0; ci < centres.length; ci++) {
      const centreX = centres[ci];
      const platformTopY = world.platformTopY(ci);
      const baseLeftX = centreX - (cols * CONFIG.BLOCK.w) / 2;
      const halfW = (cols * CONFIG.BLOCK.w) / 2;
      const castle = { id: ci, centreX, baseLeftX, platformTopY, cols, rows,
                       footX0: centreX - halfW, footX1: centreX + halfW };
      this.castles.push(castle);

      for (const d of world.makeCastlePlan(cols, rows)) {
        const body = Bodies.rectangle(
          world.blockWorldX(baseLeftX, d.gx),
          world.blockWorldY(platformTopY, d.gy),
          CONFIG.BLOCK.w, CONFIG.BLOCK.h, {
            label: 'block', chamfer: { radius: CONFIG.BLOCK.chamfer },
            density: CONFIG.BLOCK.density, friction: CONFIG.BLOCK.friction,
            frictionStatic: CONFIG.BLOCK.frictionStatic,
            restitution: CONFIG.BLOCK.restitution,
          });
        const rec = {
          body, mat: d.mat, label: d.label, castleId: ci, gx: d.gx, gy: d.gy,
          hp: CONFIG.MAT_HITS[d.mat], maxHp: CONFIG.MAT_HITS[d.mat],
        };
        body.brick = rec;
        this.blocks.push(rec);
        this.addDynamic(body);
      }

      /* The character stands on TOP of its own castle. This sets the launch
         origin, the fall check and the spawn-collision grace, and it is why
         "you lose when your guy falls" is literally true. It is DYNAMIC
         specifically so it can be toppled. */
      const topY = platformTopY - rows * CONFIG.BLOCK.h;
      const ch = Bodies.rectangle(centreX, topY - CONFIG.CHARACTER.h / 2 - 1,
        CONFIG.CHARACTER.w, CONFIG.CHARACTER.h, {
          label: 'character', chamfer: { radius: CONFIG.CHARACTER.chamfer },
          density: CONFIG.CHARACTER.density, friction: CONFIG.CHARACTER.friction,
          frictionStatic: CONFIG.CHARACTER.frictionStatic,
          restitution: CONFIG.CHARACTER.restitution,
        });
      /* characterIds is passed IN rather than read off `players`: physics
         sits below players in the layering and must not reach up. */
      const chRec = { body: ch, playerId: ci + 1, castleId: ci, facing: 1,
                      characterId: (opts.characterIds && opts.characterIds[ci]) || 'nim',
                      eliminated: false, turnStartY: ch.position.y };
      ch.charRec = chRec;
      this.characters.push(chRec);
      this.addDynamic(ch);
    }
  },

  charOf(castleId) {
    for (let i = 0; i < this.characters.length; i++) {
      if (this.characters[i].castleId === castleId) return this.characters[i];
    }
    return null;
  },

  /* Eliminated characters leave the world. Called by `turns` only — physics
     never decides that a player is out. */
  removeCharacter(rec) {
    if (!rec || rec.eliminated) return;
    rec.eliminated = true;
    if (this.dynamicBodies.indexOf(rec.body) >= 0) this.removeDynamic(rec.body);
  },

  /* --- "standing" ------------------------------------------------------
     The plan's three-part predicate, and all three parts matter. Without the
     last one a block lying flat on the ground inside its own slice counts as
     cover, which skews the CPU's "fewest standing blocks" toward castles that
     are already flattened and (at M4) lets a bonus target land on rubble. */
  isStanding(rec) {
    const cas = this.castles[rec.castleId];
    if (!cas) return false;
    const b = rec.body;
    if (this.dynamicBodies.indexOf(b) < 0) return false;          // destroyed or culled
    if (b.position.x < cas.footX0 || b.position.x > cas.footX1) return false;
    const ang = Math.abs(normAngle(b.angle));
    if (ang >= CONFIG.STANDING_MAX_ANGLE_DEG * Math.PI / 180) return false;
    return (cas.platformTopY - b.position.y) >= CONFIG.BLOCK.h / 2 - CONFIG.STANDING_SLOP;
  },

  countStanding(castleId) {
    let n = 0;
    for (let i = 0; i < this.blocks.length; i++) {
      const rec = this.blocks[i];
      if (rec.castleId === castleId && this.isStanding(rec)) n++;
    }
    return n;
  },

  /* The CPU aims at the LOWEST standing block: toppling from the base is
     both more effective and more spectacular. Ties to the one nearest the
     castle centre, so the aim point is stable between turns. */
  lowestStanding(castleId) {
    let best = null;
    const cas = this.castles[castleId];
    for (let i = 0; i < this.blocks.length; i++) {
      const rec = this.blocks[i];
      if (rec.castleId !== castleId || !this.isStanding(rec)) continue;
      if (!best) { best = rec; continue; }
      const dy = rec.body.position.y - best.body.position.y;
      if (dy > 0.5) best = rec;                                    // lower on screen = lower block
      else if (Math.abs(dy) <= 0.5 &&
               Math.abs(rec.body.position.x - cas.centreX) <
               Math.abs(best.body.position.x - cas.centreX)) best = rec;
    }
    return best;
  },

  /* No castle/block accessors here on purpose. M2's CPU and learn modules
     need "STANDING" blocks, which the plan defines as all three of: the body
     is still in the world, its centre is still inside its own castle's
     horizontal slice, AND it is still upright and elevated (|angle| < 30 deg
     and at least half a block above the platform). A naive
     blocksOf(castleId) counts rubble lying flat on the ground as cover,
     which skews CPU target selection toward already-flattened castles and
     lets a bonus target land on rubble. Write the real predicate at M2. */

  /* --- projectile ------------------------------------------------------ */
  spawnProjectile(x, y, vx, vy) {
    const p = Bodies.circle(x, y, CONFIG.PROJECTILE.radius, {
      label: 'projectile', density: CONFIG.PROJECTILE.density,
      friction: CONFIG.PROJECTILE.friction,
      restitution: CONFIG.PROJECTILE.restitution,
      /* frictionAir 0 is load-bearing: any non-zero value makes the path
         non-parabolic AND step-rate-dependent, so the dotted preview would
         stop matching the flight. */
      frictionAir: CONFIG.PROJECTILE.frictionAir,
    });
    /* Collides with nothing for SPAWN_GRACE_STEPS, so a low-power shot
       cannot detonate on the shooter's own parapet at the moment of launch. */
    p.collisionFilter.mask = 0;
    p.graceLeft = CONFIG.SPAWN_GRACE_STEPS;
    this.addDynamic(p);
    Body.setVelocity(p, { x: vx, y: vy });
    this.projectile = p;
    this.projRest = 0;
    this.projAge = 0;
    if (PERF) {
      this.crossedIds = new Set();
      this.hitIds = new Set();
      this.maxStepDisp = 0;
    }
    return p;
  },

  removeProjectile() {
    if (!this.projectile) return;
    if (PERF && this.crossedIds) {
      for (const id of this.crossedIds) if (!this.hitIds.has(id)) this.tunnelEvents++;
    }
    this.removeDynamic(this.projectile);
    this.projectile = null;
  },

  /* --- collisions ------------------------------------------------------ */
  onCollisionStart(ev) {
    const proj = this.projectile;
    if (!proj) return;
    for (const pair of ev.pairs) {
      let other = null;
      if (pair.bodyA === proj) other = pair.bodyB;
      else if (pair.bodyB === proj) other = pair.bodyA;
      else continue;

      /* impact = |relative normal velocity| * projectile mass.
         pair.contacts[].normalImpulse is NOT usable: it is only meaningful
         after the velocity solver runs and is scaled by the solver's
         internal delta. */
      const pv = Body.getVelocity(proj);
      const ov = other.isStatic ? ZERO : Body.getVelocity(other);
      const n = pair.collision ? pair.collision.normal : { x: 0, y: 1 };
      const relN = Math.abs((pv.x - ov.x) * n.x + (pv.y - ov.y) * n.y);
      const impact = relN * proj.mass;

      if (PERF && other.label === 'block') this.hitIds.add(other.id);

      if (other.label === 'block' && impact >= CONFIG.IMPACT_HIT) {
        const rec = other.brick;
        rec.hp -= 1;
        this.lastImpactStep = this.stepCount;
        this.queue.push({ type: 'blockHit', impact, rec, destroyed: rec.hp <= 0 });
        if (rec.hp <= 0) this.destroyBlock(rec);
      } else if (other.label === 'character' && impact >= CONFIG.IMPACT_HIT) {
        this.lastImpactStep = this.stepCount;
        this.queue.push({ type: 'charHit', impact, rec: other.charRec });
      } else {
        this.queue.push({ type: 'tap', impact });
      }
    }
  },

  destroyBlock(rec) {
    const i = this.blocks.indexOf(rec);
    if (i >= 0) this.blocks.splice(i, 1);
    this.removeDynamic(rec.body);
    rec.destroyedAt = this.stepCount;
  },

  /* --- per-step -------------------------------------------------------- */
  outOfBounds(x, y) {
    const c = CONFIG.CULL;
    return x < c.minX || x > c.maxX || y > c.maxY || y < c.minY;
  },

  afterStep() {
    this.stepCount++;

    const p = this.projectile;
    if (p) {
      if (p.graceLeft > 0 && --p.graceLeft === 0) p.collisionFilter.mask = 0xFFFFFFFF;

      if (PERF) {
        const dx = p.position.x - p.positionPrev.x, dy = p.position.y - p.positionPrev.y;
        const d = Math.hypot(dx, dy);
        if (d > this.maxStepDisp) this.maxStepDisp = d;
        // If the projectile CENTRE crossed a block's AABB in one step, an
        // overlap definitely occurred — so a missing collision is a tunnel.
        for (const rec of this.blocks) {
          if (segmentHitsAABB(p.positionPrev.x, p.positionPrev.y, p.position.x, p.position.y, rec.body.bounds)) {
            this.crossedIds.add(rec.body.id);
          }
        }
      }

      this.projAge++;
      const ts = BASE_DELTA / p.deltaTime;
      const vx = (p.position.x - p.positionPrev.x) * ts;
      const vy = (p.position.y - p.positionPrev.y) * ts;
      if (Math.hypot(vx, vy) < CONFIG.PROJECTILE_REST_V) this.projRest++; else this.projRest = 0;

      /* Three removal conditions. Mandatory, not tidiness: a projectile that
         comes to rest and is never removed stays a dynamic body forever — it
         blocks the settle predicate, it collides on somebody else's turn,
         and it holds inputLocked shut. */
      if (this.projRest >= CONFIG.PROJECTILE_REST_STEPS ||
          this.projAge >= CONFIG.PROJECTILE_MAX_STEPS ||
          this.outOfBounds(p.position.x, p.position.y)) {
        this.removeProjectile();
      }
    }

    // Cull. crane-stacker/index.html:730 is vertical-only; the horizontal
    // bounds are added because a near-flat max-power shot exits sideways.
    for (let i = this.dynamicBodies.length - 1; i >= 0; i--) {
      const b = this.dynamicBodies[i];
      if (b === this.projectile) continue;
      if (this.outOfBounds(b.position.x, b.position.y)) {
        if (b.label === 'block') {
          const rec = b.brick;
          const k = this.blocks.indexOf(rec);
          if (k >= 0) this.blocks.splice(k, 1);
        }
        if (b.label === 'character') this.queue.push({ type: 'charCulled', rec: b.charRec });
        this.removeDynamic(b);
      }
    }
  },

  /* Coarse calm. "Is anything still meaningfully moving?", not "is
     everything perfectly still?". At 40 px blocks, motion below these
     thresholds is invisible. Fine thresholds (|v|<0.2 / |w|<0.02) with
     sleeping off would run almost every turn to the 12-second cap, because
     one block jittering anywhere blocks the predicate. Zero-allocation on
     purpose: this runs once per rendered frame over ~60 bodies. */
  worldIsCalm() {
    const bs = this.dynamicBodies;
    for (let i = 0; i < bs.length; i++) {
      const b = bs[i];
      const ts = BASE_DELTA / b.deltaTime;
      const vx = (b.position.x - b.positionPrev.x) * ts;
      const vy = (b.position.y - b.positionPrev.y) * ts;
      if (vx * vx + vy * vy >= CONFIG.SETTLE_V * CONFIG.SETTLE_V) return false;
      if (Math.abs(b.angle - b.anglePrev) * ts >= CONFIG.SETTLE_W) return false;
    }
    return true;
  },

  forceQuiet() {
    this.removeProjectile();
    for (const b of this.dynamicBodies) {
      Body.setVelocity(b, ZERO);
      Body.setAngularVelocity(b, 0);
    }
  },

  /* Highest surface of what remains of a castle, used to re-stand a fallen
     character. Falls back to the bare platform when the castle is gone. */
  standingTopY(castleId) {
    const cas = this.castles[castleId];
    let top = cas.platformTopY;
    for (const rec of this.blocks) {
      if (rec.castleId !== castleId) continue;
      const b = rec.body;
      if (Math.abs(b.position.x - cas.centreX) > CONFIG.BLOCK.w) continue;
      if (b.bounds.min.y < top) top = b.bounds.min.y;
    }
    return top;
  },

  /* --- arc broadphase index -------------------------------------------
     O(1) candidate lookup per arc point. Naively, 420 steps against every
     block is thousands of bounds tests per frame while a finger is moving. */
  BUCKET_W: 64,
  buckets: null,
  rebuildIndex() {
    const span = CONFIG.WORLD_W + 800;
    const n = Math.ceil(span / this.BUCKET_W);
    if (!this.buckets || this.buckets.length !== n) {
      this.buckets = new Array(n);
      for (let i = 0; i < n; i++) this.buckets[i] = [];
    } else {
      for (let i = 0; i < n; i++) this.buckets[i].length = 0;
    }
    const put = (body) => {
      const a = this.bucketIndex(body.bounds.min.x);
      const b = this.bucketIndex(body.bounds.max.x);
      for (let i = a; i <= b; i++) this.buckets[i].push(body);
    };
    for (const g of this.ground) put(g);
    for (const rec of this.blocks) put(rec.body);
    this.indexDirty = false;
  },
  bucketIndex(x) {
    const i = Math.floor((x + 400) / this.BUCKET_W);
    return Math.max(0, Math.min(this.buckets.length - 1, i));
  },
  candidatesAt(x) {
    if (this.indexDirty || !this.buckets) this.rebuildIndex();
    return this.buckets[this.bucketIndex(x)];
  },
};

const ZERO = { x: 0, y: 0 };

/* Fold an angle into (-PI, PI]. Blocks start at 0, so this is "how far from
   its original orientation" without a wrap-around false positive. */
function normAngle(a) {
  const TAU = Math.PI * 2;
  let x = a % TAU;
  if (x > Math.PI) x -= TAU;
  if (x <= -Math.PI) x += TAU;
  return x;
}

function segmentHitsAABB(x0, y0, x1, y1, b) {
  // slab method
  let t0 = 0, t1 = 1;
  const dx = x1 - x0, dy = y1 - y0;
  const clip = (p, q) => {
    if (p === 0) return q >= 0;
    const r = q / p;
    if (p < 0) { if (r > t1) return false; if (r > t0) t0 = r; }
    else       { if (r < t0) return false; if (r < t1) t1 = r; }
    return true;
  };
  if (!clip(-dx, x0 - b.min.x)) return false;
  if (!clip( dx, b.max.x - x0)) return false;
  if (!clip(-dy, y0 - b.min.y)) return false;
  if (!clip( dy, b.max.y - y0)) return false;
  return true;
}

/* ============================================================= aim =======
   ONE gesture. Touch down anywhere in the active player's slice, drag,
   release. Pull back to fire forward — slingshot semantics.
   ======================================================================== */
const aim = {
  active: false, pointerId: null,
  startX: 0, startY: 0, curX: 0, curY: 0,
  dirty: false,
  dragX: 0, dragY: 0, dragLen: 0, speed: 0, dirX: 0, dirY: -1,
  velX: 0, velY: 0,

  arcXY: new Float64Array(CONFIG.ARC_MAX_STEPS * 2),
  arcN: 0,

  /* speed = MIN_SPEED + (|drag| / MAX_DRAG)^POWER_EXP * (MAX_SPEED - MIN_SPEED)
     The exponent gives fine control at low power. */
  powerCurve(len) {
    const t = clamp(len / CONFIG.MAX_DRAG, 0, 1);
    return CONFIG.MIN_SPEED + Math.pow(t, CONFIG.POWER_EXP) * (CONFIG.MAX_SPEED - CONFIG.MIN_SPEED);
  },

  /* drag = clamp(pointerStart - pointerNow, MAX_DRAG) */
  computeDrag(sx, sy, cx, cy) {
    let dx = sx - cx, dy = sy - cy;
    let len = Math.hypot(dx, dy);
    if (len > CONFIG.MAX_DRAG) {
      const k = CONFIG.MAX_DRAG / len;
      dx *= k; dy *= k; len = CONFIG.MAX_DRAG;
    }
    return { x: dx, y: dy, len };
  },

  /* Releasing below MIN_DRAG CANCELS the shot rather than firing it.
     Without this, any stray tap in a 1024x768 slab fires a live 90 px lob
     and burns the turn. */
  shouldFire(len) { return len >= CONFIG.MIN_DRAG; },

  update() {
    const d = this.computeDrag(this.startX, this.startY, this.curX, this.curY);
    this.dragX = d.x; this.dragY = d.y; this.dragLen = d.len;
    this.speed = this.powerCurve(d.len);
    if (d.len > 0.0001) { this.dirX = d.x / d.len; this.dirY = d.y / d.len; }
    this.velX = this.dirX * this.speed;
    this.velY = this.dirY * this.speed;
  },

  /* Set the shot directly, bypassing the drag. This is how the CPU lines up
     with the same dotted arc a human sees — one preview implementation, not
     two. dragLen is set to MAX_DRAG so nothing downstream mistakes a bot's
     shot for a cancelled tap. */
  setShot(vx, vy, speed) {
    const len = Math.hypot(vx, vy) || 1;
    this.velX = vx; this.velY = vy;
    this.dirX = vx / len; this.dirY = vy / len;
    this.speed = speed;
    this.dragLen = this.dragFor(speed);
    this.dragX = this.dirX * this.dragLen;
    this.dragY = this.dirY * this.dragLen;
    this.dirty = false;
  },

  /* powerCurve inverted. The CPU's drawn pull-back and power ring then show
     the power it is actually about to use, rather than a full pull on every
     shot. Note nothing gates a bot's shot on MIN_DRAG — turns.fire() is the
     primitive and only the POINTER path applies the cancel rule. */
  dragFor(speed) {
    const t = clamp((speed - CONFIG.MIN_SPEED) / (CONFIG.MAX_SPEED - CONFIG.MIN_SPEED), 0, 1);
    return CONFIG.MAX_DRAG * Math.pow(t, 1 / CONFIG.POWER_EXP);
  },

  /* Projectile spawns SPAWN_OFFSET_Y above the character's top edge, so a
     low-power shot clears the shooter's own parapet. */
  launchPoint(chRec) {
    const b = chRec.body;
    return { x: b.position.x, y: b.bounds.min.y - CONFIG.SPAWN_OFFSET_Y };
  },

  /* The arc is computed by iterating the EXACT SAME integrator the engine
     uses, not a closed-form parabola. Matter's Body.update is position-
     Verlet: velocity is updated and THEN position advances by the new
     velocity, so the true closed form is p0 + u*n + a*n(n+1)/2, not
     p0 + u*n + 0.5*a*n^2. Iterating is a few hundred adds and is exact by
     construction. */
  integrate(x0, y0, vx, vy, maxSteps, onPoint) {
    const k = CONFIG.STEP_MS / BASE_DELTA;
    const a = CONFIG.GRAVITY_Y * CONFIG.GRAVITY_SCALE * CONFIG.STEP_MS * CONFIG.STEP_MS;
    let dx = vx * k, dy = vy * k, x = x0, y = y0;
    for (let s = 1; s <= maxSteps; s++) {
      dy += a;
      x += dx; y += dy;
      if (onPoint(x, y, s) === false) return s;
    }
    return maxSteps;
  },

  /* Truncation: first ground/block intersection, the CULL BOUNDS, or
     ARC_MAX_STEPS — whichever comes first. Note the cull bounds and NOT
     y = 0 on the top edge: a near-vertical shot legitimately climbs above
     the world and comes back down. */
  arcOut(x, y) {
    const c = CONFIG.CULL;
    return x < c.minX || x > c.maxX || y > c.maxY;
  },

  blocked(x, y, ownChar) {
    const cands = physics.candidatesAt(x);
    for (let i = 0; i < cands.length; i++) {
      const bb = cands[i].bounds;
      if (x >= bb.min.x && x <= bb.max.x && y >= bb.min.y && y <= bb.max.y) return true;
    }
    for (let i = 0; i < physics.characters.length; i++) {
      const c = physics.characters[i];
      if (c === ownChar || c.eliminated) continue;
      const bb = c.body.bounds;
      if (x >= bb.min.x && x <= bb.max.x && y >= bb.min.y && y <= bb.max.y) return true;
    }
    return false;
  },

  rebuildArc(chRec) {
    const p = this.launchPoint(chRec);
    const arr = this.arcXY;
    let n = 0;
    const self = this;
    this.integrate(p.x, p.y, this.velX, this.velY, CONFIG.ARC_MAX_STEPS, (x, y, s) => {
      arr[n * 2] = x; arr[n * 2 + 1] = y; n++;
      if (self.arcOut(x, y)) return false;
      if (s > CONFIG.SPAWN_GRACE_STEPS && self.blocked(x, y, chRec)) return false;
      return true;
    });
    this.arcN = n;
  },
};

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

/* ============================================================= cpu =======
   The bot is a CLOWN, not a rival. Difficulty is aim error, never a damage
   multiplier — a cannonball that hurts more when the computer throws it is
   the one thing a 4-year-old would notice and resent. v1 ships EASY only.

   Every function here is pure or read-only over `physics`, and every one
   takes its randomness as an argument, so ?selftest=1 can drive the whole
   chain with a seeded generator instead of hoping.
   ======================================================================== */
const cpu = {
  DEG: Math.PI / 180,

  /* Target selection: among LIVING opponents, the one whose castle has the
     FEWEST standing blocks; ties to nearest. Targeting the weakest is what
     makes matches end — targeting the healthiest would mean the bot never
     finishes anyone off, and at 4 players with +/-12 deg of error a match
     could run past twenty rounds.

     `opponents` is [{ id, castleId, alive }]. Returns the chosen opponent
     plus the aim point, which is the lowest standing block of that castle,
     or that opponent's CHARACTER when the castle is gone. A living opponent
     whose castle is gone is still a valid target; hitting an empty list is
     the crash this fallback exists to prevent. */
  chooseTarget(shooterCastleId, opponents, rnd) {
    const from = physics.castles[shooterCastleId];
    let best = null, bestN = Infinity, bestD = Infinity, ties = 0;
    for (const o of opponents) {
      if (!o.alive || o.castleId === shooterCastleId) continue;
      const cas = physics.castles[o.castleId];
      if (!cas) continue;
      const ch = physics.charOf(o.castleId);
      if (!ch || ch.eliminated) continue;
      const n = physics.countStanding(o.castleId);
      const d = from ? Math.abs(cas.centreX - from.centreX) : cas.centreX;
      if (n < bestN || (n === bestN && d < bestD - 0.5)) {
        best = o; bestN = n; bestD = d; ties = 1;
      } else if (n === bestN && Math.abs(d - bestD) <= 0.5) {
        /* Fully tied on BOTH keys — same standing count, same distance.
           Reservoir-pick one at random rather than taking the lowest castle
           id. At 4 players the two neighbours of a middle castle are exactly
           equidistant, so index order would send every bot at castle 0 on the
           opening round, and castle 0 is the human in every ?slots=hc.. run.
           That is an implementation accident, not the plan's rule. */
        ties++;
        if (rnd && rnd() < 1 / ties) { best = o; bestD = d; }
      }
    }
    if (!best) return null;

    const block = physics.lowestStanding(best.castleId);
    if (block) {
      return { opponent: best, kind: 'block',
               x: block.body.position.x, y: block.body.position.y };
    }
    const ch = physics.charOf(best.castleId);
    return { opponent: best, kind: 'character',
             x: ch.body.position.x, y: ch.body.position.y };
  },

  /* Ballistic solve, in Body.setVelocity units (px per BASE_DELTA).
       tan(theta) = (v^2 +/- sqrt(v^4 - g(g R^2 + 2 h v^2))) / (g R)
     Returns { lo, hi } elevation angles in radians above the horizontal, or
     null when the target is out of range at that speed. `h` is the height
     GAIN, so positive means the target is above the launch point — remember
     +y is DOWN everywhere else in this file. */
  solveAngles(R, h, v) {
    const g = world.gravityPerTick();
    if (R <= 0.0001) return null;
    const v2 = v * v;
    const disc = v2 * v2 - g * (g * R * R + 2 * h * v2);
    if (disc < 0) return null;
    const root = Math.sqrt(disc);
    return { lo: Math.atan2(v2 - root, g * R), hi: Math.atan2(v2 + root, g * R) };
  },

  /* Where a shot fired at this angle actually crosses the target's height on
     the way DOWN, using the engine's own integrator rather than the
     continuous formula the angle came out of. Matter's Body.update is
     position-Verlet, so the closed form is p0 + u*n + a*n(n+1)/2 and the two
     disagree by a few px over a long flight. Returns null if it never gets
     there. */
  landingX(x0, y0, v, theta, dirSign, targetY, maxSteps) {
    const vx = Math.cos(theta) * v * dirSign;
    const vy = -Math.sin(theta) * v;
    let prevX = x0, prevY = y0, hit = null;
    aim.integrate(x0, y0, vx, vy, maxSteps || CONFIG.ARC_MAX_STEPS, (x, y) => {
      if (y >= targetY && prevY < targetY) {
        const t = (targetY - prevY) / (y - prevY);
        hit = prevX + (x - prevX) * t;
        return false;
      }
      prevX = x; prevY = y;
      return !aim.arcOut(x, y);
    });
    return hit;
  },

  /* One secant correction against the real integrator. The analytic angle is
     already within a few px; this removes the position-Verlet offset so the
     bot's aim is honest before the error is injected on top of it. */
  refine(x0, y0, v, theta, dirSign, target) {
    const targetX = target.x, targetY = target.y;
    const want = Math.abs(targetX - x0);
    const a = this.landingX(x0, y0, v, theta, dirSign, targetY);
    if (a === null) return theta;
    const eps = 0.5 * this.DEG;
    const b = this.landingX(x0, y0, v, theta + eps, dirSign, targetY);
    if (b === null) return theta;
    const da = Math.abs(a - x0) - want;
    const db = Math.abs(b - x0) - want;
    const slope = (db - da) / eps;
    if (!isFinite(slope) || Math.abs(slope) < 1e-6) return theta;
    let next = theta - da / slope;
    const cap = 10 * this.DEG;
    if (next > theta + cap) next = theta + cap;
    if (next < theta - cap) next = theta - cap;
    if (next <= 0.5 * this.DEG || next >= 89.5 * this.DEG) return theta;
    return next;
  },

  /* aim.blocked() with one castle excluded. The CPU aims at the LOWEST
     standing block, and any arc that reaches it has to pass through the
     blocks stacked on top of it — so the target's own castle cannot count as
     an obstruction or every good shot reads as blocked. Everything else
     does, including the shooter's own parapet. */
  blockedIgnoring(x, y, ownChar, ignoreCastleId) {
    const cands = physics.candidatesAt(x);
    for (let i = 0; i < cands.length; i++) {
      const body = cands[i];
      if (body.brick && body.brick.castleId === ignoreCastleId) continue;
      const bb = body.bounds;
      if (x >= bb.min.x && x <= bb.max.x && y >= bb.min.y && y <= bb.max.y) return true;
    }
    for (let i = 0; i < physics.characters.length; i++) {
      const c = physics.characters[i];
      if (c === ownChar || c.eliminated || c.castleId === ignoreCastleId) continue;
      const bb = c.body.bounds;
      if (x >= bb.min.x && x <= bb.max.x && y >= bb.min.y && y <= bb.max.y) return true;
    }
    return false;
  },

  /* Is something IN THE WAY — an intervening castle — before the shot gets
     where it is going? Reaching the aim point is clean. Sailing out of the
     world without touching anything is a miss, not an obstruction, and the
     fallback chain cannot fix a miss. */
  obstructed(x0, y0, vx, vy, ownChar, target) {
    const ignore = target.opponent ? target.opponent.castleId : -1;
    const tol = CONFIG.CPU.blockTolPx;
    let blockedEarly = false;
    aim.integrate(x0, y0, vx, vy, CONFIG.ARC_MAX_STEPS, (x, y, step) => {
      if (Math.hypot(x - target.x, y - target.y) <= tol) return false;   // arrived
      if (aim.arcOut(x, y)) return false;                                // just a miss
      if (step > CONFIG.SPAWN_GRACE_STEPS && this.blockedIgnoring(x, y, ownChar, ignore)) {
        blockedEarly = true;
        return false;
      }
      return true;
    });
    return blockedEarly;
  },

  /* Solve a shot from `from` to `target`. Prefers the HIGH arc — the lobbier
     of the two solutions clears an intervening castle far more often, and it
     is the one that looks like the bot is trying. Returns null when the
     target is out of range at MAX_SPEED. */
  aimAt(from, target) {
    const dx = target.x - from.x;
    const R = Math.abs(dx);
    const dirSign = dx >= 0 ? 1 : -1;
    const h = from.y - target.y;                     // +y is DOWN, so this is height GAIN
    const vMin = world.minSpeedFor(R, h);
    if (!isFinite(vMin) || vMin > CONFIG.MAX_SPEED) return null;
    const v = clamp(vMin * CONFIG.CPU.solveMargin, CONFIG.MIN_SPEED, CONFIG.MAX_SPEED);
    const sol = this.solveAngles(R, h, v);
    if (!sol) return null;
    return { v, dirSign, lo: sol.lo, hi: sol.hi };
  },

  toVelocity(v, theta, dirSign) {
    return { vx: Math.cos(theta) * v * dirSign, vy: -Math.sin(theta) * v, speed: v };
  },

  /* Angle error +/- angleErrDeg, power jitter +/- powerJitter. Shaped as
     config so medium (+/-6 deg / +/-4%) and hard (+/-2 deg / +/-1%) are a
     data change, not a code change, if a human ever asks for them. */
  applyError(shot, rnd) {
    const cfg = CONFIG.CPU;
    const ang = Math.atan2(shot.vy, shot.vx) + (rnd() * 2 - 1) * cfg.angleErrDeg * this.DEG;
    const spd = clamp(shot.speed * (1 + (rnd() * 2 - 1) * cfg.powerJitter),
                      CONFIG.MIN_SPEED, CONFIG.MAX_SPEED);
    return { vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, speed: spd, silly: !!shot.silly };
  },

  /* The silly shot. Near-vertical, low-to-mid power, tipped very slightly
     toward whoever it was supposedly aiming at, so it reads as a failed
     attempt rather than a bug. NOT error-injected afterwards — it is already
     deliberate, and 12 degrees of wobble on top could turn it into a hit. */
  sillyShot(dirSign, rnd) {
    const cfg = CONFIG.CPU;
    const elev = (cfg.sillyElevMinDeg + rnd() * (cfg.sillyElevMaxDeg - cfg.sillyElevMinDeg)) * this.DEG;
    const v = cfg.sillySpeedMin + rnd() * (cfg.sillySpeedMax - cfg.sillySpeedMin);
    return { vx: Math.cos(elev) * v * dirSign, vy: -Math.sin(elev) * v, speed: v, silly: true };
  },

  /* The whole chain. NEVER returns null for a living shooter — a skipped
     turn would strand the round manager. Fallbacks, in the plan's order:
       (a) retarget to the nearest living opponent
       (b) fire at max power at 45 degrees toward the target                */
  decide(shooterCastleId, opponents, rnd) {
    rnd = rnd || Math.random;
    const ch = physics.charOf(shooterCastleId);
    if (!ch || ch.eliminated) return null;
    const from = aim.launchPoint(ch);

    const target = this.chooseTarget(shooterCastleId, opponents, rnd);
    if (!target) return null;                        // no living opponent: the match is over

    const dirSign = target.x - from.x >= 0 ? 1 : -1;

    if (rnd() < CONFIG.CPU.sillyShotChance) {
      const shot = this.sillyShot(dirSign, rnd);
      return { shot, target, reason: 'silly' };
    }

    const candidates = [target];
    const near = this.nearestOpponentTarget(shooterCastleId, opponents, from, target);
    if (near) candidates.push(near);                 // fallback (a)

    for (let i = 0; i < candidates.length; i++) {
      const t = candidates[i];
      const sol = this.aimAt(from, t);
      if (!sol) continue;
      for (const which of ['hi', 'lo']) {
        const theta = this.refine(from.x, from.y, sol.v, sol[which], sol.dirSign, t);
        const shot = this.toVelocity(sol.v, theta, sol.dirSign);
        if (this.obstructed(from.x, from.y, shot.vx, shot.vy, ch, t)) continue;
        return { shot: this.applyError(shot, rnd), target: t,
                 reason: i === 0 ? which : 'retarget-' + which };
      }
    }

    // (b) Never a skipped turn.
    const shot = this.toVelocity(CONFIG.MAX_SPEED, 45 * this.DEG, dirSign);
    return { shot: this.applyError(shot, rnd), target, reason: 'fallback45' };
  },

  nearestOpponentTarget(shooterCastleId, opponents, from, exclude) {
    let best = null, bestD = Infinity;
    for (const o of opponents) {
      if (!o.alive || o.castleId === shooterCastleId) continue;
      if (exclude && exclude.opponent && o.castleId === exclude.opponent.castleId) continue;
      const cas = physics.castles[o.castleId];
      const c = physics.charOf(o.castleId);
      if (!cas || !c || c.eliminated) continue;
      const d = Math.abs(cas.centreX - from.x);
      if (d < bestD) { bestD = d; best = o; }
    }
    if (!best) return null;
    const block = physics.lowestStanding(best.castleId);
    if (block) return { opponent: best, kind: 'block', x: block.body.position.x, y: block.body.position.y };
    const c = physics.charOf(best.castleId);
    return { opponent: best, kind: 'character', x: c.body.position.x, y: c.body.position.y };
  },
};

/* Deterministic PRNG, for ?selftest=1 only. Math.random cannot answer "does
   the silly shot fire 12% of the time" reproducibly. */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* =========================================================== audio =======
   Synthesized, never downloaded. Every entry point is guarded: an
   AudioContext may throw, and an unguarded throw inside a turn takes the
   turn with it.
   ======================================================================== */
const audio = {
  ctx: null, on: true, noise: null, failed: false,

  ensure() {
    if (this.failed) return null;
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { this.failed = true; return null; }
        this.ctx = new AC();
      }
      // iOS keeps the context suspended until a user gesture resumes it.
      if (this.ctx.state === 'suspended' && this.ctx.resume) this.ctx.resume();
    } catch (e) { this.failed = true; this.ctx = null; }
    return this.ctx;
  },

  noiseBuffer() {
    const c = this.ctx;
    if (this.noise) return this.noise;
    const n = Math.floor(c.sampleRate * 0.5);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
    return buf;
  },

  /* boom — white-noise burst through a lowpass sweeping 1200 -> 80 Hz. */
  boom(strength) {
    if (!this.on) return;
    const c = this.ensure(); if (!c) return;
    try {
      const t = c.currentTime;
      const dur = 0.4;
      const amp = clamp(0.25 + (strength || 0) * 0.0035, 0.25, 0.85);
      const src = c.createBufferSource();
      src.buffer = this.noiseBuffer();
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(1200, t);
      lp.frequency.exponentialRampToValueAtTime(80, t + dur);
      const g = c.createGain();
      g.gain.setValueAtTime(amp, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(lp); lp.connect(g); g.connect(c.destination);
      src.start(t); src.stop(t + dur);
    } catch (e) { /* never let a cue take the turn with it */ }
  },

  /* launch — rising sine sweep, 120 ms. */
  launch(power) {
    if (!this.on) return;
    const c = this.ensure(); if (!c) return;
    try {
      const t = c.currentTime, dur = 0.12;
      const o = c.createOscillator(); o.type = 'sine';
      const f0 = 220 + (power || 0) * 8;
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f0 * 2.4, t + dur);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t + dur * 0.35);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  },

  /* thunk — short filtered click for a hit that lands under IMPACT_HIT. */
  thunk() {
    if (!this.on) return;
    const c = this.ensure(); if (!c) return;
    try {
      const t = c.currentTime, dur = 0.07;
      const src = c.createBufferSource();
      src.buffer = this.noiseBuffer();
      const bp = c.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 260; bp.Q.value = 1.2;
      const g = c.createGain();
      g.gain.setValueAtTime(0.18, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(bp); bp.connect(g); g.connect(c.destination);
      src.start(t); src.stop(t + dur);
    } catch (e) {}
  },
};

/* =========================================================== turns =======
   The ONLY module that calls setState(), and the only one that mutates a
   player slot. Turn manager, round manager, turn-end detection, the guard
   order out of TURN_RESULT, and the CPU turn driver.

   Every turn-lifecycle and health decision below routes through `turnRules`
   or `playerRules`, which is what ?selftest=1 asserts. Do not reimplement
   those predicates inline.
   ======================================================================== */
const turns = {
  cur: 0,            // index into players.list (== castleId)
  round: 0,
  order: [],         // player ids, fixed for the match
  orderIdx: -1,      // position of `cur` inside order
  shotFired: false,
  turnSteps: 0,      // accumulated fixed steps SINCE FIRING
  calmSteps: 0,
  resultSteps: 0,
  introSteps: 0,
  idleSinceMs: 0,
  forcedEnds: 0,     // turns that ended via the TURN_MAX_STEPS backstop
  shots: 0,
  winnerId: null,
  pendingIdx: 0,     // who PASS_DEVICE is waiting on
  /* ?perf=1 is a stress RIG, not a match: one slot, cycling forever, no
     hearts and no elimination. Without this the single slot is the last
     player standing after its first shot and the rig ends instantly. */
  stressLoop: false,

  // CPU turn driver. Counted in SIMULATED steps, not wall clock, for the same
  // reason TURN_MAX_STEPS is: steps do not advance while PAUSED.
  cpuPhase: null,    // null | 'think' | 'aim'
  cpuSteps: 0,
  cpuShot: null,

  // Per-turn damage bookkeeping, resolved once at turn end.
  hitChars: [],      // playerIds struck by this turn's projectile
  shotPoints: 0,     // points this shot has earned, for stats.bestShotDamage
  shotSelfHit: false,

  /* Debug surface for /qa and the M2 exit gate ("every player gets exactly
     one turn per round"). Bounded, written once per turn, never per frame. */
  turnLog: [],

  setState(next) {
    state.curState = next;
    if (next === STATES.PLAYER_TURN) {
      /* Cleared ONLY when no projectile is in flight. That clause is
         load-bearing: pausing mid-flight and resuming re-enters PLAYER_TURN,
         and without it the lock would clear while the shot was still
         travelling and the player could fire twice in one turn.

         The second clause is M2: a CPU turn is input-locked for its whole
         duration, because P3 says the turn manager treats both kinds
         identically and the human must not be able to fire the bot's shot. */
      const p = this.activePlayer();
      state.inputLocked = (physics.projectile !== null) || !p || p.kind !== 'human';
    } else {
      state.inputLocked = true;
    }
    if (next !== STATES.PLAYER_TURN) this.cancelAim();
  },

  /* Any in-progress drag dies when we leave PLAYER_TURN. Without this a
     finger still down when the turn ends keeps aim.active set, and the arc
     is drawn over the pass-device screen. */
  cancelAim() {
    aim.active = false;
    aim.pointerId = null;
    aim.arcN = 0;
  },

  activeChar() { return physics.charOf(this.cur); },
  activePlayer() { return players.list[this.cur] || null; },

  /* ---- match / round ------------------------------------------------- */

  /* Round order is fixed for the whole match and snapshotted here, so
     eliminating a player mid-round cannot reshuffle who is still owed a
     turn. Living players are picked out of it; the dead are skipped. */
  startMatch() {
    this.round = 0;
    this.winnerId = null;
    this.order = players.list.map(p => p.id);
    this.turnLog.length = 0;
    this.beginRound();
  },

  beginRound() {
    this.round += 1;
    this.orderIdx = -1;
    this.introSteps = 0;
    this.setState(STATES.ROUND_INTRO);
  },

  /* ROUND_INTRO branches on the SAME human/CPU test as TURN_RESULT, and it
     has to. Round rollover leaves TURN_RESULT via ROUND_COMPLETE, bypassing
     the pass-device guard entirely; without this branch a 2-human match ends
     round N on Player 2's turn and opens round N+1 on Player 1's turn while
     Player 2 is still holding the tablet. */
  endIntro() {
    const first = this.firstLivingInOrder();
    if (!first) { this.finish(); return; }
    this.pendingIdx = first.idx;
    if (turnRules.afterIntro(first.player.kind, players.livingHumans().length) === STATES.PASS_DEVICE) {
      this.setState(STATES.PASS_DEVICE);
    } else {
      this.beginTurn(first.idx);
    }
  },
