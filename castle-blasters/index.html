  T('physics', 'cull fires on all four bounds', () => {
    ok(physics.outOfBounds(CONFIG.CULL.minX - 1, 400), 'left');
    ok(physics.outOfBounds(CONFIG.CULL.maxX + 1, 400), 'right');
    ok(physics.outOfBounds(400, CONFIG.CULL.maxY + 1), 'bottom');
    ok(physics.outOfBounds(400, CONFIG.CULL.minY - 1), 'top');
    ok(!physics.outOfBounds(512, 384), 'centre of the world must not cull');
    ok(!physics.outOfBounds(0, 0), 'world corner must not cull');
    return 'x<' + CONFIG.CULL.minX + ' x>' + CONFIG.CULL.maxX +
           ' y>' + CONFIG.CULL.maxY + ' y<' + CONFIG.CULL.minY;
  });

  T('physics', 'per-step displacement cannot tunnel, gravity included', () => {
    /* Matter.js has no continuous collision detection, so the whole
       anti-tunnelling argument is this ratio.

       The plan quotes 6 px/step = MAX_SPEED * (STEP_MS / BASE_DELTA). That is
       only the LAUNCH figure. A shot fired downward keeps accelerating, so
       the real worst case is bigger — measured at 7.5 px/step in the ?perf=1

    const launch = CONFIG.MAX_SPEED * (CONFIG.STEP_MS / BASE_DELTA);
    near(launch, 6, 0.01, 'launch displacement per step');

    const a = CONFIG.GRAVITY_Y * CONFIG.GRAVITY_SCALE * CONFIG.STEP_MS * CONFIG.STEP_MS;
    let worst = 0, d = launch, y = CONFIG.CULL.minY;
    while (y < CONFIG.CULL.maxY) { d += a; y += d; if (d > worst) worst = d; }

    ok(worst < CONFIG.PROJECTILE.radius,
       'worst-case step ' + worst.toFixed(2) + ' px reaches the projectile radius ' +
       CONFIG.PROJECTILE.radius + ' — tunnelling becomes possible');
    ok(worst < CONFIG.BLOCK.w / 2,
       'worst-case step must stay under half a block (' + (CONFIG.BLOCK.w / 2) + ')');
    return 'launch ' + launch.toFixed(2) + ', worst case ' + worst.toFixed(2) +
           ' px/step vs radius ' + CONFIG.PROJECTILE.radius + ' and block ' + CONFIG.BLOCK.w;
  });

  /* ---- world ---- */
  T('world', 'castle centres for n=2,3,4 match WORLD_W*(i+0.5)/n', () => {
    const expect = { 2: [256, 768], 3: [512 / 3, 512, 2560 / 3], 4: [128, 384, 640, 896] };
    for (const n of [2, 3, 4]) {
      const got = world.castleCentres(n);
      ok(got.length === n, 'wrong count for n=' + n);
      for (let i = 0; i < n; i++) near(got[i], expect[n][i], 1e-9, 'n=' + n + ' i=' + i);
    }
    return 'n=2 [256,768]  n=3 [171,512,853]  n=4 [128,384,640,896]';
  });

  T('world', 'slices tile the world with no gap or overlap', () => {
    for (const n of [1, 2, 3, 4]) {
      let prev = 0;
      for (let i = 0; i < n; i++) {
        const s = world.slice(n, i);
        near(s.x0, prev, 1e-9, 'gap at n=' + n + ' i=' + i);
        prev = s.x1;
      }
      near(prev, CONFIG.WORLD_W, 1e-9, 'slices do not reach the right edge at n=' + n);
    }
    return 'n=1..4 tile 0..' + CONFIG.WORLD_W + ' exactly';
  });

  T('world', 'label mix always finds an eligible block for letters AND numbers', () => {
    for (const count of [9, 12]) {
      const mix = CONFIG.LABEL_MIX[count];
      ok(mix, 'no mix for ' + count);
      ok(mix.letters + mix.numbers === count, 'mix does not sum to ' + count);
      ok(mix.letters > 0 && mix.numbers > 0, 'both modes need at least one');
      for (let trial = 0; trial < 60; trial++) {
        const labels = world.makeLabels(count, Math.random);
        ok(labels.length === count, 'wrong label count');
        const letters = labels.filter(l => /[A-Z]/.test(l));
        const numbers = labels.filter(l => /[0-9]/.test(l));
        ok(letters.length === mix.letters, 'letters ' + letters.length + ' != ' + mix.letters);
        ok(numbers.length === mix.numbers, 'numbers ' + numbers.length + ' != ' + mix.numbers);
        ok(new Set(labels).size === count, 'repeats inside one castle');
      }
    }
    return '60 shuffles each at 9 and 12: mix held, no repeats';

  T('world', 'block descriptor -> world conversion respects +y DOWN', () => {
    const platformTopY = 700, baseLeftX = 452;
    near(world.blockWorldX(baseLeftX, 0), 472, 1e-9, 'gx=0 centre');
    near(world.blockWorldX(baseLeftX, 2), 552, 1e-9, 'gx=2 centre');
    near(world.blockWorldY(platformTopY, 0), 680, 1e-9, 'gy=0 (bottom row) centre');
    near(world.blockWorldY(platformTopY, 3), 560, 1e-9, 'gy=3 centre');
    ok(world.blockWorldY(platformTopY, 3) < world.blockWorldY(platformTopY, 0),

    return 'precondition 1 holds against a fully calm world';
  });

    ok(turnRules.canEndTurn(false, CONFIG.QUIET_AFTER_IMPACT_STEPS, CONFIG.SETTLE_STEPS) === true,

  });

  T('turns', 'settle needs SETTLE_STEPS CONSECUTIVE steps', () => {

    for (let i = 0; i < CONFIG.SETTLE_STEPS - 1; i++) calm = turnRules.settleTick(calm, true, 1);

    return 'resets to 0 on any non-calm sample; settles at ' + CONFIG.SETTLE_STEPS;
  });

  T('turns', 'settle thresholds are the COARSE ones', () => {
    ok(CONFIG.SETTLE_V === 1.2, 'SETTLE_V must be 1.2, not the fine 0.2');
    ok(CONFIG.SETTLE_W === 0.08, 'SETTLE_W must be 0.08, not the fine 0.02');
    // crane-stacker uses 0.2 / 0.02 for landing detection. Copying those here

    ok(CONFIG.SETTLE_V > 0.2 && CONFIG.SETTLE_W > 0.02, 'fine thresholds leaked in');

  });

  T('turns', 'TURN_MAX_STEPS force-ends the turn', () => {
    ok(turnRules.forceEnd(CONFIG.TURN_MAX_STEPS - 1) === false, 'ended early');
    ok(turnRules.forceEnd(CONFIG.TURN_MAX_STEPS) === true, 'never force-ended');
    near(CONFIG.TURN_MAX_STEPS * CONFIG.STEP_MS / 1000, 12, 0.01, 'backstop is 12s of sim time');
    return CONFIG.TURN_MAX_STEPS + ' steps = 12.00 s of simulated time';
  });

  T('turns', 'sleeping is OFF and the step rate is fixed', () => {
    ok(physics.engine.enableSleeping === false,

    near(CONFIG.STEP_MS, 16.666 / 3, 1e-12, 'STEP_MS');

  T('turns', 'entering PLAYER_TURN only unlocks input when nothing is in flight', () => {

    ok(fontIsReallyLoaded({ css: '500 20px', family: 'Fredoka' }) === true,

  /* ---- view ---- */
  T('view', 'toWorld inverse-transforms through the letterbox', () => {
    // Portrait: 768 x 1024. scale = min(768/1024, 1024/768) = 0.75.

    const offY = (1024 - CONFIG.WORLD_H * s) / 2;
    near(offY, 224, 1e-9, 'portrait letterbox bar');
    const p = view.static_toWorld(384, 512, 0, 0, 0, offY, s);
    near(p.x, 512, 1e-9, 'centre x');
    near(p.y, 384, 1e-9, 'centre y');

    ok(Math.abs(naive.y - p.y) > 100,
       'raw coords must NOT agree with toWorld in portrait — off by ' +

    return 'portrait centre maps to (512,384); raw coords would be off by ' +
           Math.abs(naive.y - p.y).toFixed(0) + ' px';

  /* ---- report ---- */
  const passed = results.filter(r => r.ok).length;
  const total = results.length;
  const list = $('st-list');
  for (const r of results) {
    const li = document.createElement('li');
    li.className = r.ok ? 'ok' : 'bad';
    li.innerHTML =
      '<span class="tag">' + (r.ok ? 'PASS' : 'FAIL') + '</span>' +
      '<span class="grp">' + r.group + '</span>' +
      '<span class="msg">' + r.name + '<span class="why">' + r.why + '</span></span>';
    list.appendChild(li);

  const score = $('st-score');
  score.textContent = passed + ' / ' + total + (passed === total ? '  PASS' : '  FAIL');
  score.className = passed === total ? 'pass' : 'fail';
  $('selftest').hidden = false;

  const line = 'selftest ' + passed + '/' + total;
  if (passed === total) console.log('%c' + line + ' PASS', 'color:#43e6a5;font-weight:700');
  else console.error(line + ' FAIL', results.filter(r => !r.ok));

  window.__selftest = { passed, total, results };
  return { passed, total };
}

// Small surface for /qa and the perf gate. Not used by the game itself.
window.CastleBlasters = { CONFIG, state, turns, physics, aim, world, view, players, perf };

boot();
})();
</script>

<!-- Service worker registration for PWA / offline -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .catch(err => console.warn('Service worker registration failed:', err));
    });
  }
</script>
